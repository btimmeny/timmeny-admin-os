# Capability configuration for the daily email review.
#
# This file is the only place a Gmail label, a permitted action, or an approval
# rule is named. Code reads capabilities generically: adding a capability, or
# changing what one may do, is an edit here, not a branch in a function.
#
# Two separate grants govern an action. `allowed_actions` is what may be
# approved and recorded; `execution.permitted_actions` is what may actually
# reach the mailbox. `GMAIL_WRITE_ENABLED` sits over both as a kill switch.
#
# Bump `version` whenever a capability's behaviour changes. Every review run
# records the version and a digest of this file, so a past run can be explained
# by the configuration that produced it.

version: "2026-08-04.1"
channel: email

# Presentation contracts. A screen decides what a review looks like — the
# columns, their order, the wording, the sort, and the decisions offered — so
# that nothing downstream has to invent a layout. Screens are versioned: change
# what is shown by editing a screen; change it incompatibly by adding a `-v2`
# and pointing a capability at it.
#
# The three screens share one column set today through a YAML anchor. Writing
# the columns out in one of them is how it stops sharing.
screens:
  - id: admin-review-v1
    kind: table
    title: Admin — today's review
    rows: unresolved
    columns: &review_columns
      - label: "#"
        source: index
        align: right
      - label: Group
        source: group
      - label: What it is
        source: what_it_is
        max_chars: 80
      - label: Key Facts
        source: key_facts
        max_chars: 60
      - label: Recommended Action
        source: recommended_action
      - label: Why
        source: why
        max_chars: 120
      - label: Confidence
        source: confidence
        format: percent
        align: right
      - label: Decision
        source: decision
    sort:
      - source: received
        direction: desc
    actions:
      - id: approve
        label: Do what is recommended
        decision: approve
      # `move_gmail_thread_to_trash` is what "delete" means here: Gmail's
      # Trash, recoverable, never permanent deletion. `move_gmail_thread_to_label`
      # is the other way out of the inbox: the thread is kept, in a named folder.
      - id: archive_gmail_thread
        label: Archive
        decision: override
        action: gmail.archive
      - id: move_gmail_thread_to_label
        label: File it in a folder
        decision: override
        action: gmail.move
      - id: move_gmail_thread_to_trash
        label: Move to Trash
        decision: override
        action: gmail.trash
      - id: draft_reply
        label: Draft a reply
        decision: override
        action: gmail.draft_reply
      - id: make_task
        label: Make it a Monday task
        decision: override
        action: monday.create_task
      - id: dismiss
        label: Leave it alone
        decision: dismiss
      - id: defer
        label: Not today
        decision: defer
      - id: archive_gmail_thread_all
        label: Archive all of these
        decision: override
        action: gmail.archive
        scope: group
      - id: move_gmail_thread_to_label_all
        label: File all of these in one folder
        decision: override
        action: gmail.move
        scope: group
      - id: move_gmail_thread_to_trash_all
        label: Move all of these to Trash
        decision: override
        action: gmail.trash
        scope: group
    footer: >-
      {remaining_items} still need you. Answer with the row number and what
      to do with it.
    empty_text: Nothing administrative is waiting.

  - id: tax-review-v1
    kind: table
    title: Financial/Taxes — today's review
    rows: unresolved
    columns: *review_columns
    sort:
      - source: received
        direction: desc
    actions:
      - id: approve
        label: Do what is recommended
        decision: approve
      - id: move_gmail_thread_to_label
        label: File it in a folder
        decision: override
        action: gmail.move
      - id: draft_reply
        label: Draft a reply
        decision: override
        action: gmail.draft_reply
      - id: make_task
        label: Make it a Monday task
        decision: override
        action: monday.create_task
      - id: dismiss
        label: Leave it alone
        decision: dismiss
      - id: defer
        label: Not today
        decision: defer
      - id: move_gmail_thread_to_label_all
        label: File all of these in one folder
        decision: override
        action: gmail.move
        scope: group
    footer: >-
      {remaining_items} still need you. Nothing here is archived or answered
      unless you say so; filing keeps the thread and only clears the inbox.
    empty_text: No tax or financial mail is waiting.

  - id: advisor-review-v1
    kind: table
    title: Advisory & expert calls — today's review
    rows: unresolved
    columns: *review_columns
    sort:
      - source: received
        direction: desc
    actions:
      - id: approve
        label: Do what is recommended
        decision: approve
      - id: archive_gmail_thread
        label: Archive
        decision: override
        action: gmail.archive
      - id: move_gmail_thread_to_label
        label: File it in a folder
        decision: override
        action: gmail.move
      - id: move_gmail_thread_to_trash
        label: Move to Trash
        decision: override
        action: gmail.trash
      - id: draft_reply
        label: Draft a reply
        decision: override
        action: gmail.draft_reply
      - id: make_task
        label: Make it a Monday task
        decision: override
        action: monday.create_task
      - id: dismiss
        label: Leave it alone
        decision: dismiss
      - id: defer
        label: Not today
        decision: defer
      - id: archive_gmail_thread_all
        label: Archive all of these
        decision: override
        action: gmail.archive
        scope: group
      - id: move_gmail_thread_to_label_all
        label: File all of these in one folder
        decision: override
        action: gmail.move
        scope: group
      - id: move_gmail_thread_to_trash_all
        label: Move all of these to Trash
        decision: override
        action: gmail.trash
        scope: group
    footer: >-
      {remaining_items} still need you. A reply is drafted for approval here,
      never sent by agreeing to it.
    empty_text: No call requests are waiting.

capabilities:
  - key: admin
    name: Admin
    enabled: true
    position: 10
    description: >-
      Administrative mail: notifications, receipts, and digests. Mostly
      disposable, which is why both dispositions are permitted here: archiving
      keeps the thread, and Trash keeps it recoverable. Neither is ever
      recommended on its own — the rules below only ever suggest archiving.
    gmail:
      labels:
        - Admin
      # Where the review looks. INBOX means actionable mail only: archived,
      # snoozed, trashed, spam, sent-only and draft-only threads are not part
      # of the review unless another scope is explicitly asked for.
      mailbox: INBOX
      # Where a kept thread may be filed. Every name here is a label the
      # mailbox already has: a folder is chosen from this list, never invented,
      # and a move to anything else is refused before it reaches Gmail.
      destinations:
        - Admin
        - Admin/- Meetings
        - Admin/spam & junk
        - Later
        - Notes
        - General & Personal
    presentation:
      screen: admin-review-v1
    playbook:
      id: triage_and_clear
      steps:
        - collect_evidence
        - recommend
        - await_decision
        - prepare_actions
        - execute_approved
        - verify
    recommendation_policy:
      version: admin.v2
      default: needs_review
      categories:
        - receipt
        - confirmation
        - notice
        - newsletter
        - other
      allow_ai_recommendation: true
      min_ai_confidence: 0.8
      rules:
        # Deliberately narrow: each rule names a sender the mailbox actually
        # receives, and recommends only archiving. Nothing here decides on its
        # own — an archive recommendation still waits for a decision.
        - id: usps_informed_delivery_digest
          when:
            participant_domains:
              - email.informeddelivery.usps.com
            subject_contains:
              - Daily Digest
          recommend: gmail.archive
          confidence: 0.95
          rationale: >-
            A USPS Informed Delivery digest is a daily notice with nothing to
            act on once it has been seen.
        - id: github_notification_gone_stale
          when:
            participants:
              - notifications@github.com
            older_than_days: 7
          recommend: gmail.archive
          confidence: 0.85
          rationale: >-
            A GitHub notification older than a week has been overtaken by the
            pull request it describes.
    allowed_actions:
      - gmail.label
      - gmail.archive
      - gmail.move
      - gmail.trash
      # The undo of Trash, granted wherever Trash is: a disposition nobody can
      # reverse is one nobody should be asked to confirm in a hurry.
      - gmail.untrash
      - gmail.draft_reply
      - monday.create_task
    approval:
      # Empty on purpose: archiving, filing, and Trash are approved item by
      # item, or by a rule that has been separately confirmed and promoted.
      # Nothing leaves the inbox unattended by default.
      auto_approve: []
      min_confidence_for_auto: 1.0
      allow_bulk_decisions: true
    execution:
      permitted_actions:
        - gmail.label
        - gmail.archive
        - gmail.move
        - gmail.trash
        - gmail.untrash
        - gmail.draft_reply
      require_verification: true
    completion:
      require_all_items_decided: true
      require_executed_actions: true
    learning:
      scope: capability
      record_decisions: true
      record_message_content: false
      allow_rule_learning: true
      allow_automatable_rules: true
    objectives:
      default_keys:
        - operational_hygiene
      require_alignment: false

  - key: financial_taxes
    name: Financial/Taxes
    enabled: true
    position: 20
    description: >-
      Tax and financial correspondence. Obligations here have deadlines and
      counterparties, so nothing is acted on without confirmation.
    gmail:
      labels:
        - Financial/Taxes
      mailbox: INBOX
      # Filing is the one disposition this capability has: tax mail is kept,
      # and the folders it may be kept in are the financial ones.
      destinations:
        - Financial
        - Financial/Taxes
        - Financial/Health Care
        - Financial/McLean Home
        - Financial/Park City Home
        - Later
    presentation:
      screen: tax-review-v1
    playbook:
      id: evidence_to_obligation
      steps:
        - collect_evidence
        - recommend
        - await_decision
        - prepare_actions
        - execute_approved
        - verify
    recommendation_policy:
      version: taxes.v2
      default: needs_review
      categories:
        - filing_obligation
        - payment
        - advisor_update
        - statement
        - other
      allow_ai_recommendation: true
      min_ai_confidence: 0.9
      rules:
        # Records, not requests. Each rule below names mail that says what has
        # already happened — a form issued, a payment acknowledged, a document
        # posted — which belongs in a folder rather than an inbox. Mail that
        # asks for something (a fee proposal, a missing-information request)
        # matches none of them and stays where it will be seen.
        - id: tax_form_or_authority_receipt
          when:
            subject_contains:
              - "1099"
              - TAX INFORMATION STATEMENT
              - TAX RETURN DOCUMENT AVAILABLE
              - FBAR Submission Accepted
              - Fincen Acknowledgement
              - IRS Direct Pay Confirmation
              - Buzón Tributario
          recommend: gmail.move
          move_to: Financial/Taxes
          confidence: 0.9
          rationale: >-
            A tax form or an authority's acknowledgement is a record to keep,
            and keeping it means somewhere it can be found next April.
        - id: kpmg_statement_or_document_notice
          when:
            participant_domains:
              - kpmg.com
              - kpmg.com.mx
            subject_contains:
              - Account Statement
              - Edo de cuenta
              - Complemento de Pago
              - Confirmación de recepción
              - New Document(s) Posted
              - e-Filing Authorization Forms Receipt
          recommend: gmail.move
          move_to: Financial/Taxes
          confidence: 0.85
          rationale: >-
            KPMG has sent a statement or posted a document rather than asked
            for anything, so filing it with the rest of the tax year loses
            nothing.
    allowed_actions:
      - gmail.label
      - gmail.archive
      - gmail.move
      - gmail.draft_reply
      - monday.create_task
    approval:
      auto_approve: []
      min_confidence_for_auto: 1.0
      allow_bulk_decisions: true
    execution:
      # Filing runs here where archiving does not, and deliberately so: a filed
      # thread is somewhere nameable, while an archived one is only "not in the
      # inbox", which is the wrong way to lose a tax deadline.
      permitted_actions:
        - gmail.label
        - gmail.move
        - gmail.draft_reply
      require_verification: true
    completion:
      require_all_items_decided: true
      require_executed_actions: true
    learning:
      scope: capability
      record_decisions: true
      record_message_content: false
      allow_rule_learning: true
      allow_automatable_rules: false
    objectives:
      default_keys:
        - financial_compliance
      require_alignment: false

  - key: career_advisor_calls
    name: Career - Advisory/Expert Calls
    enabled: true
    position: 30
    description: >-
      Requests for advisory or expert calls. Time-boxed, reputational, and
      usually answered rather than filed.
    gmail:
      labels:
        - Career - Advisory/Expert Calls
      mailbox: INBOX
      destinations:
        - Career - Advisory
        - Career - Advisory/Expert Calls
        - Career - Advisory/Expert Survey
        - Career - Advisory/Transforml
        - Career - Advisory/Vibranium Labs
        - Career/- Conferences
        - Later
    presentation:
      screen: advisor-review-v1
    playbook:
      id: respond_or_schedule
      steps:
        - collect_evidence
        - recommend
        - await_decision
        - prepare_actions
        - execute_approved
        - verify
    recommendation_policy:
      version: career.v2
      default: needs_review
      categories:
        - call_request
        - scheduling
        - follow_up
        - newsletter
        - other
      allow_ai_recommendation: true
      min_ai_confidence: 0.8
      rules:
        # A survey is not a call, and the two are kept apart. Only the survey
        # invitations are recommended for filing: a call request is answered,
        # and a thread filed out of the inbox is a call nobody takes.
        - id: expert_network_survey_invitation
          when:
            participant_domains:
              - alphasights.com
              - arbolus.com
              - capvision.com
              - dialecticanet.com
              - prosapient.com
              - tegus.com
              - thirdbridge.com
              - truenorthinsights.com
            subject_contains:
              - survey
          recommend: gmail.move
          move_to: Career - Advisory/Expert Survey
          confidence: 0.85
          rationale: >-
            An expert network asking for a survey rather than a call belongs
            with the surveys, which is a different folder and a different
            decision from an expert call.
    allowed_actions:
      - gmail.label
      - gmail.archive
      - gmail.move
      - gmail.trash
      - gmail.untrash
      - gmail.draft_reply
      - gmail.send_draft
      - monday.create_task
    approval:
      auto_approve: []
      min_confidence_for_auto: 1.0
      allow_bulk_decisions: true
    execution:
      permitted_actions:
        - gmail.label
        - gmail.archive
        - gmail.move
        - gmail.trash
        - gmail.untrash
        - gmail.draft_reply
        - gmail.send_draft
      require_verification: true
    completion:
      require_all_items_decided: true
      require_executed_actions: true
    learning:
      scope: capability
      record_decisions: true
      record_message_content: false
      allow_rule_learning: true
      allow_automatable_rules: false
    objectives:
      default_keys:
        - career_network
      require_alignment: false
