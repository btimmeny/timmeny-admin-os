openapi: 3.1.0
info:
  title: Timmeny Admin OS
  version: 0.20.0
  description: >-
    Admin OS: the session, the playbook it runs, and the mailbox review.
    Served by the deployment that implements it, at /gpt/action-schema.yaml,
    so an import from that URL is the running commit.
    /gpt/action-schema/version says what is deployed; an import that
    disagrees is stale.
servers:
  - url: https://timmeny-admin-os-production.up.railway.app
security:
  - ApiKeyAuth: []
paths:
  /review/start:
    post:
      operationId: startDailyReview
      summary: Review the mailbox as it is now
      description: >-
        Starts admin outside a session: "hello", "check my inbox",
        "refresh". Every call reads Gmail and reviews what it says now, under
        a new review_id; the review replaced keeps its decisions, named in
        supersedes_review_id. Returns the plan, no group: print
        plan.opening.text, then beginReviewPlan on "go".
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  default: 50
                scope:
                  type: string
                  enum: [inbox, archived, snoozed, everything]
                  description: >-
                    Which mail to review. Omit it: the review is of the inbox,
                    and that is not a preference to confirm. Send one only
                    where Brian asks for other mail in so many words — "my
                    archive", "my snoozed mail", "everything". Another scope
                    opens its own review of the day.
      responses:
        "200":
          description: Review started or resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
  /review/continue:
    post:
      operationId: continueDailyReview
      summary: Resume the review already under way
      description: >-
        The only operation that resumes, and only where Brian asks in so many
        words: "where was I?", "continue", "pick up where we left off".
        Returns the same review_id with its progress; print plan.opening.text
        first here too. It never opens one — 404 where there is none, 409
        where today's is finished.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  default: 50
                scope:
                  type: string
                  enum: [inbox, archived, snoozed, everything]
                  description: >-
                    Which review to resume. Omit it for the inbox review.
      responses:
        "200":
          description: >-
            The review under way, with its plan. A plan already begun is
            returned active, and the review resumes from plan.current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: There is no review of today to continue.
        "409":
          description: Today's review is finished with, and was not reopened.
  /review/restart:
    post:
      operationId: restartDailyReview
      summary: Replace the review in hand with one of the mailbox now
      description: >-
        startDailyReview under the name for asking: "refresh mail", "check
        again", "anything new?". Refreshes the mailbox and opens the next
        revision of the date; the review replaced keeps its decisions, is
        named in supersedes_review_id, and loses any open preparation. Gmail
        is not changed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  default: 50
                scope:
                  type: string
                  enum: [inbox, archived, snoozed, everything]
                  description: >-
                    Which review to restart. Omit it for the inbox review.
      responses:
        "200":
          description: A new review of the same date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
  /review/runs/{run_id}/plan:
    post:
      operationId: beginReviewPlan
      summary: Agree the plan for this review, and get the first group
      description: >-
        The plan is Brian's to agree before the first table: show
        plan.message and plan.groups, then call this when he says to begin.
        Send order, only or skip only where he named groups — "Financial
        first", "only Admin", "skip Legal today" — by capability key, and for
        today alone.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: array
                  items:
                    type: string
                  description: >-
                    Capability keys to work first, in this order. Groups not
                    named keep their configured order behind them.
                only:
                  type: array
                  items:
                    type: string
                  description: Work only these groups today; set the rest aside.
                skip:
                  type: array
                  items:
                    type: string
                  description: Set these groups aside for today.
      responses:
        "200":
          description: The plan, begun, with the first group to work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: No such review.
        "422":
          description: >-
            A named group is not in this review, or every group was set aside.
            Say which; do not retry with a guess.
  /review/runs/{run_id}:
    get:
      operationId: readDailyReview
      summary: Read the current review state
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
  /review/runs/{run_id}/groups/{capability_key}:
    get:
      operationId: readReviewGroup
      summary: Read one capability group
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: capability_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  capability_key:
                    type: string
                    description: >-
                      The only name this group is addressed by. policy_version
                      and screen_id name its policy and its layout, and a
                      request sending either as the key is refused with 404.
                  state:
                    type: string
                    enum: [pending, in_progress, awaiting_actions, completed]
                  outstanding_execution:
                    $ref: "#/components/schemas/OutstandingExecution"
                  scope:
                    $ref: "#/components/schemas/ReviewScope"
                  screen:
                    type: object
                    properties:
                      title:
                        type: string
                      columns:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            item_id:
                              type: string
                            cells:
                              type: array
                              items:
                                type: string
                            actions:
                              type: array
                              items:
                                type: string
                      footer:
                        type: string
                      empty_text:
                        type: string
                      notice:
                        type: string
                        description: >-
                          Show it above the table, as written, whenever it is
                          present. It is where the review says that decisions
                          taken have not reached Gmail.
                  restorable:
                    type: array
                    description: >-
                      Threads this capability moved to Trash and may take back
                      out of it. Each entry carries the exact request that
                      restores it.
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        thread_id:
                          type: string
                        subject:
                          type: string
                        action:
                          type: string
                        method:
                          type: string
                        path:
                          type: string
                        body:
                          type: object
                          additionalProperties: true
                additionalProperties: true
  /review/runs/{run_id}/items/{item_id}/decision:
    post:
      operationId: decideReviewItem
      summary: Record a decision on one item
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, override, dismiss, defer]
                action:
                  type: string
                  description: >-
                    The action to take, named as the row offers it. Gmail
                    dispositions are archive_gmail_thread,
                    move_gmail_thread_to_label and
                    move_gmail_thread_to_trash; "delete", "remove" and
                    "trash" all mean Trash, which is recoverable.
                    restore_gmail_thread_from_trash undoes one.
                action_params:
                  type: object
                  description: >-
                    What the action needs. move_gmail_thread_to_label needs
                    the folder to file the thread in, as
                    {"label": "Later"}, chosen from the choices the action
                    carries on the screen. Approving a recommended move with
                    no action_params files it in the folder the row showed.
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                  additionalProperties: true
                note:
                  type: string
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    type: object
                    description: >-
                      The review as it now stands. Recording a decision is not
                      taking the action it authorises: read
                      run.outstanding_execution before saying anything about
                      what has happened, and never report a decision as done.
                    properties:
                      review_id:
                        type: string
                      state:
                        type: string
                      outstanding_execution:
                        type: array
                        items:
                          $ref: "#/components/schemas/OutstandingExecution"
                      current_group:
                        type: object
                        properties:
                          capability_key:
                            type: string
                          state:
                            type: string
                          screen:
                            type: object
                            properties:
                              title:
                                type: string
                              notice:
                                type: string
                    additionalProperties: true
                  decided:
                    type: array
                    description: The rows this call decided, in their new state.
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        state:
                          type: string
                        approved_action:
                          type: string
                additionalProperties: true
  /review/runs/{run_id}/groups/{capability_key}/decisions:
    post:
      operationId: decideReviewGroup
      summary: Record one decision for several items
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: capability_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, override, dismiss, defer]
                item_ids:
                  type: array
                  items:
                    type: string
                action:
                  type: string
                  description: >-
                    The action to take on every selected row, named as the
                    rows offer it. If any selected row does not permit it the
                    whole request is refused with 409 and nothing is recorded;
                    the response names each ineligible item and why.
                action_params:
                  type: object
                  description: >-
                    What the action needs, applied to every selected row.
                    Filing several threads at once names one folder for all
                    of them, as {"label": "Later"}.
                  properties:
                    label:
                      type: string
                  additionalProperties: true
                note:
                  type: string
      responses:
        "200":
          description: Decisions recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    type: object
                    description: >-
                      The review as it now stands. Recording a decision is not
                      taking the action it authorises: read
                      run.outstanding_execution before saying anything about
                      what has happened, and never report a decision as done.
                    properties:
                      review_id:
                        type: string
                      state:
                        type: string
                      outstanding_execution:
                        type: array
                        items:
                          $ref: "#/components/schemas/OutstandingExecution"
                      current_group:
                        type: object
                        properties:
                          capability_key:
                            type: string
                          state:
                            type: string
                          screen:
                            type: object
                            properties:
                              title:
                                type: string
                              notice:
                                type: string
                    additionalProperties: true
                  decided:
                    type: array
                    description: The rows this call decided, in their new state.
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        state:
                          type: string
                        approved_action:
                          type: string
                additionalProperties: true
        "409":
          description: >-
            No decision was recorded, because at least one selected row does
            not permit it. Every offending row is named with its reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      message:
                        type: string
                      ineligible:
                        type: array
                        items:
                          type: object
                          properties:
                            item_id:
                              type: string
                            thread_id:
                              type: string
                            subject:
                              type: string
                            reason:
                              type: string
  /review/runs/{run_id}/actions/prepare:
    post:
      operationId: prepareReviewActions
      summary: Prepare the selected rows, and fix the scope
      description: >-
        Prepare only the exact selected item_ids, or the full capability only
        when entire_capability is explicitly true. Returns scope_id,
        prepared_item_ids, action_ids, exclusions, and whether scope matched.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capability_key:
                  type: string
                item_ids:
                  type: array
                  description: The exact rows the user selected.
                  items:
                    type: string
                entire_capability:
                  type: boolean
                  default: false
                  description: >-
                    Only true when the user asked for every approved row in
                    the capability. Requires capability_key, and cannot be
                    combined with item_ids.
      responses:
        "200":
          description: Actions prepared, and the scope they may execute.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope_id:
                    type: string
                  capability_key:
                    type: string
                  entire_capability:
                    type: boolean
                  requested_item_ids:
                    type: array
                    items:
                      type: string
                  prepared_item_ids:
                    type: array
                    items:
                      type: string
                  action_ids:
                    type: array
                    items:
                      type: string
                  prepared_items:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        action_id:
                          type: string
                        action:
                          type: string
                        thread_id:
                          type: string
                  excluded_items:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        reason:
                          type: string
                  scope_matches_request:
                    type: boolean
                  gmail_write_enabled:
                    type: boolean
                  counts:
                    type: object
                    properties:
                      prepared:
                        type: integer
                      failed:
                        type: integer
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action_id:
                          type: string
                        item_id:
                          type: string
                        state:
                          type: string
                        action:
                          type: string
                additionalProperties: true
        "400":
          description: >-
            The selection was not stated. Ask the user which rows they mean
            rather than resending without item_ids.
  /review/runs/{run_id}/actions/execute:
    post:
      operationId: executeReviewActions
      summary: Execute one prepared scope, and verify it
      description: >-
        Execute only the prepared scope. Requires scope_id, the exact prepared
        item_ids and action_ids, and confirm: true. Reject stale or mismatched
        scopes without writing to Gmail, then verify each result.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_id, item_ids, action_ids, confirm]
              properties:
                scope_id:
                  type: string
                  description: The scope returned by prepareReviewActions.
                item_ids:
                  type: array
                  description: >-
                    The rows being confirmed, restated: exactly the
                    prepared_item_ids the same preparation returned.
                  items:
                    type: string
                action_ids:
                  type: array
                  description: >-
                    The action ids the scope prepared, restated: exactly the
                    action_ids the same preparation returned.
                  items:
                    type: string
                confirm:
                  type: boolean
                  description: >-
                    True only when the user has confirmed this execution
                    itself, after seeing what the preparation covers.
      responses:
        "422":
          description: >-
            A required field was missing. Nothing was written. Read the
            preparation again and restate scope_id, item_ids and action_ids
            from it rather than filling any of them in from memory.
        "409":
          description: >-
            ScopeMismatch. Nothing was written. The body names the prepared
            and requested rows and how they differ; show that difference and
            prepare again rather than retrying.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      error:
                        type: string
                      message:
                        type: string
                      scope_id:
                        type: string
                      prepared_item_ids:
                        type: array
                        items:
                          type: string
                      requested_item_ids:
                        type: array
                        items:
                          type: string
                    additionalProperties: true
        "200":
          description: Actions executed and verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gmail_write_enabled:
                    type: boolean
                  counts:
                    type: object
                    properties:
                      completed:
                        type: integer
                      failed:
                        type: integer
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action_id:
                          type: string
                        item_id:
                          type: string
                        state:
                          type: string
                        action:
                          type: string
                        last_error:
                          type: string
                additionalProperties: true
  /review/runs/{run_id}/items/{item_id}/send-draft:
    post:
      operationId: approveSendDraft
      summary: Approve sending one verified draft
      description: Approves the exact draft; execution remains separate.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_id, draft_message_id, confirm]
              properties:
                draft_id:
                  type: string
                draft_message_id:
                  type: string
                confirm:
                  type: boolean
      responses:
        "200":
          description: Draft send approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_id:
                    type: string
                  item_id:
                    type: string
                  state:
                    type: string
                  action:
                    type: string
                additionalProperties: true
  /learning/rules:
    post:
      operationId: proposeCandidateRule
      summary: Propose an inactive deterministic rule
      description: Creates a proposal only; it does not activate or execute the rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capability_key, match, action, rationale]
              properties:
                capability_key:
                  type: string
                match:
                  type: object
                  properties:
                    participants:
                      type: array
                      items:
                        type: string
                    participant_domains:
                      type: array
                      items:
                        type: string
                    subject_contains:
                      type: array
                      items:
                        type: string
                    older_than_days:
                      type: integer
                    newer_than_days:
                      type: integer
                  additionalProperties: false
                action:
                  type: string
                action_params:
                  type: object
                  description: >-
                    What the action needs. A rule that files mail names its
                    folder here, as {"label": "Later"}, and the folder must
                    be one the capability files mail in.
                  properties:
                    label:
                      type: string
                  additionalProperties: true
                rationale:
                  type: string
                confidence:
                  type: number
      responses:
        "201":
          description: Rule proposed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  capability_key:
                    type: string
                  action:
                    type: string
                additionalProperties: true
  /learning/rules/{rule_id}/confirm:
    post:
      operationId: confirmCandidateRule
      summary: Confirm a rule for recommendations
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Rule confirmed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  active:
                    type: boolean
                additionalProperties: true
  /learning/rules/{rule_id}/promote:
    post:
      operationId: promoteCandidateRule
      summary: Promote a confirmed rule to automatable
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                reason:
                  type: string
      responses:
        "200":
          description: Rule promoted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  may_execute_without_approval:
                    type: boolean
                additionalProperties: true
  /session/start:
    post:
      operationId: startSession
      summary: "Wake up: load the playbook and state the session's plan"
      description: >-
        The first call of an admin interaction: "hello", "good morning",
        "what do I need to do?". Loads the playbook, holds that revision,
        reads Gmail, states the plan. It presents no work: print
        opening.text, then plan.message, and wait. order, skip and only are
        for today. To resume, continueSession.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  default: 50
                scope:
                  type: string
                  enum: [inbox, archived, snoozed, everything]
                  description: >-
                    Which mail the email activity reviews. Omit it for the
                    inbox.
                order:
                  type: array
                  items:
                    type: string
                  description: >-
                    Activity keys to work first, in this order, for this
                    session only - "do the calendar first today".
                only:
                  type: array
                  items:
                    type: string
                  description: Work only these activities this session.
                skip:
                  type: array
                  items:
                    type: string
                  description: >-
                    Activities to set aside for this session only - "skip
                    objectives today".
      responses:
        "200":
          description: A session, with its plan stated and nothing worked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /session/continue:
    post:
      operationId: continueSession
      summary: Resume the session already under way
      description: >-
        For "continue", "where was I?", "pick up where we left off", and only
        where Brian says something like one of them. Returns the same session
        with the revision it opened with, even where the playbook has changed
        since. It never opens a session: with none under way it answers 404.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                playbook_id:
                  type: string
      responses:
        "200":
          description: The session under way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: No session is under way.
  /session/{session_id}:
    get:
      operationId: getSession
      summary: Report where a session stands
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session, changing nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /session/{session_id}/begin:
    post:
      operationId: beginSession
      summary: Start working the plan, from the activity in hand
      description: >-
        Call when Brian says to begin, and not before. Starts the activity
        plan.current names, or the first that can be worked. For the email
        activity this also begins the review plan in the playbook's step
        order, so the review comes back with its first group.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session, with the activity under way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /session/{session_id}/activities/{activity_key}/begin:
    post:
      operationId: beginSessionActivity
      summary: Start one activity by name
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: activity_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session, with that activity under way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "409":
          description: >-
            That activity cannot be worked - it was set aside for this
            session, or it is in the playbook and not built yet.
  /session/{session_id}/advance:
    post:
      operationId: advanceSession
      summary: Move on to the next activity
      description: >-
        Only once the activity in hand is finished with, which Admin OS asks
        of the work rather than takes on trust: an email review holding
        decisions the mailbox has not seen is not finished. At the end,
        closeout says what the session did and what it still owes.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session, at the next activity or completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /playbook:
    get:
      operationId: getActivePlaybook
      summary: The playbook a session would run right now
      description: >-
        For "what do we do in a session?", "what's in the playbook?" and
        before proposing a change. Read the activities and their steps as
        written; the order is the order.
      parameters:
        - name: playbook_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The playbook in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playbook"
  /admin/monday/scope:
    get:
      operationId: getMondayScope
      summary: What the playbook's Monday scope resolves to on the live board
      description: >-
        For "is Monday set up?" and after a scope change. Read-only. Reports
        the columns and labels found on the board and how many items are in
        scope, or, where one is missing, what the board has instead. Nothing
        is reviewed and nothing is written.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The scope, resolved or refused with the reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MondayScopeCheck"
  /playbook/revisions:
    get:
      operationId: listPlaybookRevisions
      summary: Every version this playbook has had
      parameters:
        - name: playbook_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The revisions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybookRevisions"
  /playbook/revisions/{revision_id}:
    get:
      operationId: getPlaybookRevision
      summary: One version of the playbook, exactly as it stood
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: That revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybookRevisionDetail"
  /playbook/propose:
    post:
      operationId: proposePlaybookChange
      summary: Write down a change to the playbook, and change nothing yet
      description: >-
        For "from now on, always do objectives before email" — anything meant
        to hold beyond today. It changes nothing: it records what the playbook
        would become. Read effect, order_now and order_after back, and confirm
        on an explicit yes alone. "Skip objectives today" is startSession's
        skip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/PlaybookChange"
                rationale:
                  type: string
                  description: Why Brian asked for it, in his words where he gave one.
                playbook_id:
                  type: string
      responses:
        "200":
          description: >-
            A proposed revision. It is not in force, and validation says
            whether it could be.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: "#/components/schemas/PlaybookRevision"
                  effect:
                    type: array
                    items:
                      type: string
                    description: >-
                      What the change does, in sentences. Read these back
                      before confirming.
                  order_now:
                    type: array
                    items:
                      type: string
                  order_after:
                    type: array
                    items:
                      type: string
                  message:
                    type: string
                    description: One paragraph, safe to show as written.
                  validation:
                    $ref: "#/components/schemas/PlaybookValidation"
                  confirm_action:
                    type: object
                    description: >-
                      The exact request that makes this the playbook. Send it
                      only after Brian confirms.
                    properties:
                      operation:
                        type: string
                      method:
                        type: string
                      path:
                        type: string
                additionalProperties: true
        "400":
          description: >-
            The change does not describe anything the playbook contains, and
            was not recorded.
  /playbook/revisions/{revision_id}/confirm:
    post:
      operationId: confirmPlaybookChange
      summary: Make a proposed revision the playbook
      description: >-
        Send only on an explicit yes to the effect that was read back. From
        here the next session runs it; a session under way keeps the revision
        it opened with.
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
      responses:
        "200":
          description: The playbook, now on the confirmed revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playbook"
        "400":
          description: Not confirmed, so nothing changed.
        "409":
          description: >-
            That revision cannot be run against the capabilities configured
            now, and did not become the playbook.
  /playbook/revisions/{revision_id}/activate:
    post:
      operationId: activatePlaybookRevision
      summary: Put an earlier revision back in force
      description: >-
        For "go back to how it was last week", naming a revision that already
        exists. Same confirmation as confirming a change.
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
      responses:
        "200":
          description: The playbook, now on that revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playbook"
components:
  schemas:
    Session:
      type: object
      description: >-
        One run of the playbook against the state of the day. plan is what
        will be worked and in what order; review is the email activity's own,
        in the shape startDailyReview returns, and every review operation
        takes its review_id. An activity completed never means the mailbox
        changed.
      properties:
        session_id:
          type: string
        status:
          type: string
          enum: [proposed, in_progress, completed, abandoned]
          description: >-
            proposed means the plan is stated and nothing has begun. Do not
            present work while a session is proposed.
        opened_at:
          type: string
          format: date-time
        begun_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        supersedes_session_id:
          type: string
          nullable: true
        playbook:
          $ref: "#/components/schemas/SessionPlaybook"
        opening:
          $ref: "#/components/schemas/ReviewOpening"
        plan:
          $ref: "#/components/schemas/SessionPlan"
        prompt:
          $ref: "#/components/schemas/SessionPrompt"
        review:
          $ref: "#/components/schemas/Review"
        closeout:
          $ref: "#/components/schemas/SessionCloseout"
        warnings:
          type: array
          items:
            type: string
    SessionPlaybook:
      type: object
      description: >-
        The playbook revision this session runs, which may not be the one in
        force if it changed since: a session keeps what it opened with.
        validation.warnings say what the playbook names and Admin OS cannot
        do yet.
      properties:
        playbook_id:
          type: string
        name:
          type: string
        revision:
          $ref: "#/components/schemas/PlaybookRevision"
        validation:
          $ref: "#/components/schemas/PlaybookValidation"
    SessionPrompt:
      type: object
      nullable: true
      description: >-
        What Brian is being asked, and the operations that answer it. Offer
        the choices as written and wait; do not call one for him.
      properties:
        message:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              operation:
                type: string
              label:
                type: string
              method:
                type: string
              path:
                type: string
    SessionPlan:
      type: object
      description: >-
        What this session will work through. Render the activities in this
        order and with these labels: do not add one, drop one, merge two, or
        rename any. message says it in sentences and is safe to show as
        written.
      properties:
        message:
          type: string
          description: The plan in sentences. Show it exactly, before any work.
        activities:
          type: array
          items:
            type: object
            properties:
              activity_key:
                type: string
              label:
                type: string
              position:
                type: integer
              state:
                type: string
                enum:
                  [pending, in_progress, completed, skipped, unavailable]
                description: >-
                  unavailable means the playbook names it and Admin OS cannot
                  do it yet. Say that; never present it as reviewed, and never
                  quietly leave it out.
              availability:
                type: string
                enum: [built, planned]
              data_source:
                type: string
                enum: [gmail, monday, calendar, none]
              intro:
                type: string
                description: >-
                  Why the activity is in the session, in the playbook's words.
                  Show it when the activity starts.
              steps:
                type: array
                description: >-
                  What the activity covers, in order. Announce these before
                  working it.
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    label:
                      type: string
                    position:
                      type: integer
                    count:
                      type: integer
                      nullable: true
                    state:
                      type: string
                      nullable: true
              review_id:
                type: string
                nullable: true
        working:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            type: string
          description: Set aside for this session only.
        unavailable:
          type: array
          items:
            type: string
        current:
          type: string
          nullable: true
        activity_number:
          type: integer
          nullable: true
        activity_count:
          type: integer
        overrides:
          type: array
          items:
            type: string
          description: >-
            What differs from the playbook for this session alone, in
            sentences. Say them, so a change to today is never taken for a
            change to every day.
    SessionCloseout:
      type: object
      nullable: true
      description: >-
        The end of the session, counted rather than characterised. Activities
        completed and actions verified are different claims: report
        awaiting_execution as work still owed, and never call a session
        finished while it is above zero without saying so.
      properties:
        activities_completed:
          type: array
          items:
            type: string
        activities_skipped:
          type: array
          items:
            type: string
        activities_unavailable:
          type: array
          items:
            type: string
        items_reviewed:
          type: integer
        actions_verified:
          type: object
          additionalProperties:
            type: integer
          description: Counted from verified execution only.
        deferred:
          type: integer
        dismissed:
          type: integer
        awaiting_execution:
          type: integer
          description: Rows decided whose action the mailbox has not seen.
        playbook_changes_proposed:
          type: array
          items:
            type: string
        playbook_changes_activated:
          type: array
          items:
            type: string
        message:
          type: string
          description: One paragraph, safe to show as written.
    Playbook:
      type: object
      description: >-
        The playbook and the revision it is on. Read the activities and steps
        as configured; the labels are Brian's words for his own work.
        fell_back_from, where it is there, is a revision that stopped being
        runnable: say the playbook fell back rather than pretending it did not.
      properties:
        revision:
          $ref: "#/components/schemas/PlaybookRevision"
        playbook:
          $ref: "#/components/schemas/PlaybookDocument"
        validation:
          $ref: "#/components/schemas/PlaybookValidation"
        message:
          type: string
        fell_back_from:
          $ref: "#/components/schemas/PlaybookRevision"
    PlaybookRevisions:
      type: object
      description: Every revision of one playbook, newest first.
      properties:
        playbook_id:
          type: string
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/PlaybookRevision"
    PlaybookRevisionDetail:
      type: object
      description: >-
        One revision as it stood, whether or not it is the one in force.
        Validation is against the capabilities configured now.
      properties:
        revision:
          $ref: "#/components/schemas/PlaybookRevision"
        playbook:
          $ref: "#/components/schemas/PlaybookDocument"
        validation:
          $ref: "#/components/schemas/PlaybookValidation"
    PlaybookRevision:
      type: object
      description: >-
        One version of the playbook. proposed is written down and in force
        nowhere; active is what a session starting now would run.
      properties:
        revision_id:
          type: string
        playbook_id:
          type: string
        number:
          type: integer
        status:
          type: string
          enum: [proposed, active, superseded, invalid]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
          nullable: true
        superseded_at:
          type: string
          format: date-time
          nullable: true
        based_on_revision_id:
          type: string
          nullable: true
          description: >-
            The revision this was written against. A proposal is refused where
            the playbook has moved on since, rather than confirming something
            other than what was read back.
        change_summary:
          type: array
          items:
            type: string
        rationale:
          type: string
          nullable: true
    PlaybookDocument:
      type: object
      description: The activities and steps themselves, in configured order.
      properties:
        schema_version:
          type: integer
        playbook_id:
          type: string
        name:
          type: string
        auto_start_first_activity:
          type: boolean
        finish_with_summary:
          type: boolean
        monday_scope:
          $ref: "#/components/schemas/MondayScope"
        activities:
          type: array
          items:
            type: object
            properties:
              activity_key:
                type: string
              label:
                type: string
              enabled:
                type: boolean
              order:
                type: integer
              availability:
                type: string
                enum: [built, planned]
                description: >-
                  planned means the playbook names it and Admin OS cannot do
                  it yet. Say so; never present it as work done.
              data_source:
                type: string
                enum: [gmail, monday, calendar, none]
              intro:
                type: string
              steps:
                type: array
                items:
                  type: object
                  properties:
                    capability_key:
                      type: string
                    label:
                      type: string
                    enabled:
                      type: boolean
                    order:
                      type: integer
    PlaybookValidation:
      type: object
      description: >-
        Whether a playbook can be run. An error means it never becomes active
        and names the key at fault; report it as written rather than guessing
        what was meant. A warning means it runs and is honest about itself.
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
        warnings:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
    PlaybookChange:
      type: object
      description: >-
        One change to the playbook. Send exactly what Brian asked for and
        nothing more: an operation he did not ask for is a change he never
        agreed to.
      required: [operation]
      properties:
        operation:
          type: string
          enum:
            [
              enable_activity,
              disable_activity,
              move_activity,
              enable_step,
              disable_step,
              move_step,
              add_step,
              remove_step,
              update_intro,
              set_monday_scope,
              clear_monday_scope,
            ]
        activity_key:
          type: string
        capability_key:
          type: string
          description: The step, for step operations.
        before_activity_key:
          type: string
        after_activity_key:
          type: string
        before_capability_key:
          type: string
        after_capability_key:
          type: string
        label:
          type: string
        intro:
          type: string
        board_id:
          type: string
          description: The Monday board, for set_monday_scope. Digits only.
        filters:
          type: array
          description: >-
            For set_monday_scope: the columns and exact label texts that put an
            item in today's work. An item qualifies on any one of them. Send
            only ids and labels Brian gave; the board is checked before he is
            asked to confirm.
          items:
            $ref: "#/components/schemas/MondayScopeFilter"
    MondayScopeFilter:
      type: object
      description: One Monday column, and the labels on it that qualify an item.
      required: [column_id, labels]
      properties:
        column_id:
          type: string
          description: Monday's column id, not its title.
        labels:
          type: array
          minItems: 1
          description: Exact label text. Nothing near enough counts.
          items:
            type: string
    MondayScopeCheck:
      type: object
      description: >-
        The configured scope, checked against the board itself. resolved false
        with configured true means a column or label is not there: say what
        detail says and change nothing. items is how many are in scope now.
      properties:
        configured:
          type: boolean
        resolved:
          type: boolean
        board_id:
          type: string
          nullable: true
        board_name:
          type: string
          nullable: true
        describes:
          type: string
          nullable: true
          description: One sentence naming exactly which items are in scope.
        items:
          type: integer
          nullable: true
        detail:
          type: string
          nullable: true
          description: Why it does not resolve, and what the board has instead.
        filters:
          type: array
          items:
            type: object
            properties:
              column_id:
                type: string
              column_title:
                type: string
              labels:
                type: array
                items:
                  type: string
              indexes:
                type: array
                description: The label indexes Monday filters by.
                items:
                  type: integer
    MondayScope:
      type: object
      description: >-
        Which Monday items count as today's work, as the playbook names them.
        Absent means none is configured, which is not the same as none matching.
        Whether the board carries these is getMondayScope.
      properties:
        board_id:
          type: string
        match:
          type: string
        filters:
          type: array
          items:
            $ref: "#/components/schemas/MondayScopeFilter"
    OutstandingExecution:
      type: object
      description: >-
        Decisions that have been recorded and have not happened. A decision
        authorises an action; preparing, confirming and executing it is what
        changes the mailbox. Until this is gone, the threads are where they
        were: say "decided, not yet done", never "deleted" or "filed".
      properties:
        capability_key:
          type: string
        capability_name:
          type: string
        item_ids:
          type: array
          description: The exact rows waiting, and the ones to prepare.
          items:
            type: string
        approved:
          type: integer
        failed:
          type: integer
        message:
          type: string
          description: One sentence, safe to show as written.
        operation:
          type: string
          description: The operationId that carries this out - prepareReviewActions.
        method:
          type: string
        path:
          type: string
        body:
          type: object
          description: The exact request body to send, already scoped to these rows.
          additionalProperties: true
    ReviewOpening:
      type: object
      nullable: true
      description: >-
        How an admin session opens: what will be worked through, and that the
        playbook evolves by agreement. Print text exactly, first in the reply,
        before the screen and any greeting; never "how can I help?". Present
        on starting, continuing and restarting alone — said on entering, never
        between groups.
      properties:
        mode:
          type: string
          enum: [new, resumed]
          description: >-
            new where the review is being laid out, resumed where it is being
            picked up. The wording differs; the choice is Admin OS's.
        text:
          type: string
          description: Markdown, safe and required to show as written.
      required: [mode, text]

    ReviewPlan:
      type: object
      description: >-
        What this review consists of, said before any of it is presented.
        While status is proposed, current_group is absent and nothing is
        decided: show message, the groups with their counts, and the steps,
        then beginReviewPlan on "go". Never present rows while it is proposed.
      properties:
        status:
          type: string
          enum: [proposed, active]
        version:
          type: integer
          description: >-
            Raised whenever the order or the set-aside groups change. Quote it
            if asked which plan is being worked.
        title:
          type: string
        opening:
          $ref: '#/components/schemas/ReviewOpening'
        message:
          type: string
          description: One paragraph, safe to show as written.
        steps:
          type: array
          items:
            type: string
          description: >-
            What working each group will consist of, in order. Show them on the
            first plan of a review.
        resumed:
          type: boolean
          description: >-
            True where the review was already under way. The message then says
            where it stands and asks whether to resume from the current group.
        groups:
          type: array
          items:
            type: object
            properties:
              capability_key:
                type: string
              capability_name:
                type: string
              items:
                type: integer
              remaining:
                type: integer
                description: >-
                  Rows still on the table, which includes rows decided and
                  not yet carried out. standing says which is which.
              empty:
                type: boolean
              skipped:
                type: boolean
                description: Set aside for today, and not counted as remaining.
              standing:
                $ref: "#/components/schemas/ReviewStanding"
        working:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            type: string
        completed:
          type: array
          items:
            type: string
        remaining:
          type: array
          items:
            type: string
        current:
          type: string
        group_number:
          type: integer
        group_count:
          type: integer
        items:
          type: integer
        empty_groups:
          type: array
          items:
            type: string
        excluded:
          type: array
          items:
            type: string
          description: >-
            The mailboxes this review is not of. Answer "did you look at my
            archive?" from here.
        standing:
          $ref: "#/components/schemas/ReviewStanding"
    ReviewStanding:
      type: object
      description: >-
        What the review owes the mailbox, counted from actions rather than
        decisions. Any of these above zero means work is unfinished, whatever
        the tables show.
      properties:
        decided_not_executed:
          type: integer
          description: Decided, not prepared. Nothing has changed in Gmail.
        prepared_awaiting_confirmation:
          type: integer
          description: Prepared and waiting on Brian's confirmation.
        failed_or_unverified:
          type: integer
          description: Attempted with no verified result. Not done.
    ReviewSummary:
      type: object
      description: >-
        What the review has done, counted from verified execution only. Report
        completion from here and from nowhere else: a decision never raises
        one of these counts.
      properties:
        reviewed:
          type: integer
        done:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Completed actions by name - archived, filed, moved_to_trash,
            replies_drafted, replies_sent, tasks_created. Absent means it did
            not happen.
        deferred:
          type: integer
        dismissed:
          type: integer
        rule_matched:
          type: integer
          description: Rows whose recommendation came from a learned rule.
        standing:
          $ref: "#/components/schemas/ReviewStanding"
        message:
          type: string
          description: The end-of-review summary, safe to show as written.
    Review:
      type: object
      description: >-
        One review of one mailbox snapshot: what it is of, where it has got
        to, and what it still owes. Returned by starting, resuming, restarting
        and reading a review, by beginning its plan, and as a session's email
        activity. Work it with the review operations, on review_id.
      properties:
        review_id:
          type: string
          description: >-
            The review this response is about. Every decision,
            preparation and execution belongs to one review, so carry
            this id from here rather than one remembered from
            earlier in the conversation.
        run_id:
          type: string
          description: The same id, under the name the routes use.
        review_date:
          type: string
          format: date
        revision:
          type: integer
          description: >-
            Which review of that date this is. A second revision
            exists only where a finished review was deliberately
            restarted.
        status:
          type: string
          enum:
            [
              not_started,
              in_progress,
              awaiting_actions,
              completed,
              abandoned,
            ]
        state:
          type: string
          description: The same value, under its older name.
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        abandoned_at:
          type: string
          format: date-time
        evidence_refresh_at:
          type: string
          format: date-time
          description: >-
            When Gmail was last read for this review. Answer "how
            fresh is this?" from here, never from the clock.
        snapshot_at:
          type: string
          format: date-time
          description: >-
            The mailbox this review is of: when its evidence was
            first read. Show it with a fresh review.
        supersedes_review_id:
          type: string
          nullable: true
          description: >-
            The review this one replaced, where it replaced one.
        superseded:
          $ref: "#/components/schemas/Superseded"
        prompt:
          $ref: "#/components/schemas/ReviewPrompt"
        restart_available:
          type: boolean
          description: >-
            True where the review returned is finished, so the way
            to see the mail that has arrived since is a fresh
            review. False where it is under way: continue that
            instead of starting over on a morning half worked.
        restart_action:
          $ref: "#/components/schemas/RestartAction"
        plan:
          $ref: "#/components/schemas/ReviewPlan"
        summary:
          $ref: "#/components/schemas/ReviewSummary"
        scope:
          $ref: "#/components/schemas/ReviewScope"
        outstanding_execution:
          type: array
          description: >-
            Groups holding decisions the mailbox has not seen. Not
            empty means nothing has happened yet in those groups,
            whatever the table shows: say so, and offer to prepare
            them. A review with anything here is not finished.
          items:
            $ref: "#/components/schemas/OutstandingExecution"
        current_group:
          type: object
          properties:
            capability_key:
              type: string
              description: >-
                The only name a group is addressed by. policy_version
                and screen_id are versions of what it recommends and
                how it is drawn; sending either as a key is refused.
            state:
              type: string
              enum:
                [pending, in_progress, awaiting_actions, completed]
              description: >-
                awaiting_actions means every row is decided and none
                of it has been carried out.
            outstanding_execution:
              $ref: "#/components/schemas/OutstandingExecution"
            screen:
              type: object
              properties:
                title:
                  type: string
                columns:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                rows:
                  type: array
                  items:
                    type: object
                    properties:
                      item_id:
                        type: string
                      cells:
                        type: array
                        items:
                          type: string
                      actions:
                        type: array
                        items:
                          type: string
                footer:
                  type: string
                empty_text:
                  type: string
                notice:
                  type: string
                  description: >-
                    Show it above the table, as written, whenever it
                    is present. It is where the review says that
                    decisions taken have not reached Gmail.
        warnings:
          type: array
          items:
            type: string
      additionalProperties: true
    Superseded:
      type: object
      nullable: true
      description: >-
        The review a fresh snapshot set aside, present only where it was left
        holding something. Those rows were decided in that review and the
        mailbox never saw them; say so, with the message as written, rather
        than letting them disappear with the review that holds them.
      properties:
        review_id:
          type: string
        status:
          type: string
        standing:
          $ref: "#/components/schemas/ReviewStanding"
        message:
          type: string
          description: One sentence, safe to show as written.
      required: [review_id, status, standing, message]
    RestartAction:
      type: object
      nullable: true
      description: >-
        The exact request that reviews this date again on refreshed mail,
        returned as data so that acting on it takes no interpretation. Present
        where restart_available is true; call it as given when Brian asks to
        check again, and not otherwise.
      properties:
        name:
          type: string
          enum: [restartDailyReview]
        method:
          type: string
        path:
          type: string
        body:
          type: object
          additionalProperties: true
      required: [name, method, path, body]
    ReviewPrompt:
      type: object
      description: >-
        Admin OS asking rather than deciding. Present the choices as they are
        written and wait: a prompt is returned exactly where the next step is
        Brian's, and calling one of the choices without being told which is
        deciding for him.
      properties:
        reason:
          type: string
          enum: [review_completed, review_abandoned, plan_proposed]
        message:
          type: string
          description: One sentence, safe to show as written.
        choices:
          type: array
          items:
            type: object
            properties:
              operation:
                type: string
                description: The operationId to call if Brian chooses this.
              label:
                type: string
              method:
                type: string
              path:
                type: string
              body:
                type: object
                additionalProperties: true
    ReviewScope:
      type: object
      description: >-
        What the review looked at, stated by Admin OS. Answer questions about
        what was reviewed from this and nothing else - never infer the scope
        from which rows came back, and never propose a rule about it.
      properties:
        name:
          type: string
          enum: [inbox, archived, snoozed, everything]
        mailbox:
          type: string
          enum: [INBOX, ARCHIVE, SNOOZED, ANYWHERE]
        include_snoozed:
          type: boolean
        include_archived:
          type: boolean
        include_trash:
          type: boolean
        include_spam:
          type: boolean
        include_sent:
          type: boolean
        include_drafts:
          type: boolean
        requested:
          type: boolean
          description: True when this review was opened because a scope was asked for.
        gmail_query:
          type: string
          description: The Gmail search the review was built from.
        description:
          type: string
          description: One sentence about what was reviewed, safe to show as written.
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
