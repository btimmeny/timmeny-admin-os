openapi: 3.1.0
info:
  title: timmeny-admin-os API
  version: 0.5.1
  description: Read, create, and update Timmeny Admin OS todo data.
servers:
  - url: https://timmeny-admin-os-production.up.railway.app
paths:
  /health:
    get:
      operationId: checkHealth
      summary: Check service health
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status:
                    type: string
  /todos:
    get:
      operationId: listTodos
      summary: List todo items
      description: Lists open todo items from selected boards.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: list
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - todo
              - gs
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: include_done
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Todo items read successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoListResponse"
    post:
      operationId: createTodo
      summary: Create a todo item
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                list:
                  type: string
                  enum:
                    - todo
                    - gs
                  default: todo
                action_group:
                  type:
                    - string
                    - "null"
                action_date:
                  type:
                    - string
                    - "null"
                  format: date
                action:
                  type:
                    - string
                    - "null"
                annual_objective:
                  type:
                    - string
                    - "null"
                initiative_project:
                  type:
                    - string
                    - "null"
      responses:
        "200":
          description: Todo item created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoWriteResponse"
  /todos/metadata:
    get:
      operationId: getTodoMetadata
      summary: Get todo board metadata
      security:
        - ApiKeyAuth: []
      parameters:
        - name: list
          in: query
          required: false
          schema:
            type: string
            enum:
              - todo
              - gs
            default: gs
      responses:
        "200":
          description: Board metadata read successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoMetadataResponse"
  /key-initiatives:
    get:
      operationId: listKeyInitiatives
      summary: List key initiatives
      description: Lists open items from the GS Key Initiatives group.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: include_done
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Key Initiatives read successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyInitiativeListResponse"
  /todos/{item_id}/action-metadata:
    patch:
      operationId: updateTodoActionMetadata
      summary: Update todo action metadata
      security:
        - ApiKeyAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - list
              properties:
                list:
                  type: string
                  enum:
                    - todo
                    - gs
                action_group:
                  type:
                    - string
                    - "null"
                action_date:
                  type:
                    - string
                    - "null"
                  format: date
                action:
                  type:
                    - string
                    - "null"
                annual_objective:
                  type:
                    - string
                    - "null"
                initiative_project:
                  type:
                    - string
                    - "null"
      responses:
        "200":
          description: Todo action metadata updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoWriteResponse"
  /todos/bulk-action-metadata-json:
    post:
      operationId: bulkUpdateTodoActionMetadata
      summary: Bulk update todo action metadata
      description: Updates many todo items. Prefer updates as an array. The API also accepts updates_json as a JSON string array.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      item_id:
                        type: string
                      list:
                        type: string
                        enum:
                          - todo
                          - gs
                      action_group:
                        type:
                          - string
                          - "null"
                      action_date:
                        type:
                          - string
                          - "null"
                        format: date
                      action:
                        type:
                          - string
                          - "null"
                      annual_objective:
                        type:
                          - string
                          - "null"
                      initiative_project:
                        type:
                          - string
                          - "null"
                updates_json:
                  type: string
                  description: Optional JSON string array of update objects.
      responses:
        "200":
          description: Bulk update completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  success:
                    type: boolean
                  updated_count:
                    type: integer
                  failed_count:
                    type: integer
components:
  schemas:
    TodoWriteResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        item_id:
          type: string
        title:
          type: string
        list:
          type: string
        action_group:
          type:
            - string
            - "null"
        action_date:
          type:
            - string
            - "null"
        action:
          type:
            - string
            - "null"
        annual_objective:
          type:
            - string
            - "null"
        initiative_project:
          type:
            - string
            - "null"
    TodoItem:
      type: object
      additionalProperties: true
      properties:
        item_id:
          type: string
        title:
          type: string
        list:
          type: string
        group_id:
          type:
            - string
            - "null"
        group_title:
          type:
            - string
            - "null"
        action_group:
          type:
            - string
            - "null"
        action_date:
          type:
            - string
            - "null"
        action:
          type:
            - string
            - "null"
        annual_objective:
          type:
            - string
            - "null"
        initiative_project:
          type:
            - string
            - "null"
        status:
          type:
            - string
            - "null"
        owner:
          type:
            - string
            - "null"
        due_date:
          type:
            - string
            - "null"
    TodoListResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        count:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/TodoItem"
    TodoMetadataResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        list:
          type: string
        columns:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
              title:
                type: string
              type:
                type: string
              labels:
                type: array
                items:
                  type: string
              observed_values:
                type: array
                items:
                  type: string
    KeyInitiativeListResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        count:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/TodoItem"
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
