openapi: 3.1.0
info:
  title: timmeny-admin-os API
  version: 0.6.0
  description: GPT-safe API for reading, creating, and updating Timmeny Admin OS todos.
servers:
  - url: https://timmeny-admin-os-production.up.railway.app
paths:
  /health:
    get:
      operationId: checkHealth
      summary: Check service health
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /todos/read-simple:
    get:
      operationId: listTodos
      summary: List todo items as GPT-safe text
      description: Returns selected todo items as compact text with item IDs and metadata.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: list
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - todo
              - gs
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: include_done
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Todo items read successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptReadResponse"

  /todos:
    post:
      operationId: createTodo
      summary: Create a todo item
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                list:
                  type: string
                  enum:
                    - todo
                    - gs
                  default: todo
                action_group:
                  type: string
                action_date:
                  type: string
                action:
                  type: string
                annual_objective:
                  type: string
                initiative_project:
                  type: string
      responses:
        "200":
          description: Todo item created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoWriteResponse"

  /todos/metadata/read-simple:
    get:
      operationId: getTodoMetadata
      summary: Get todo board metadata as GPT-safe text
      description: Returns configured Monday columns as compact text.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: list
          in: query
          required: false
          schema:
            type: string
            enum:
              - todo
              - gs
            default: gs
      responses:
        "200":
          description: Board metadata read successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptReadResponse"

  /key-initiatives/read-simple:
    get:
      operationId: listKeyInitiatives
      summary: List Key Initiatives as GPT-safe text
      description: Returns open items from the GS Key Initiatives group as compact text.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: include_done
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Key Initiatives read successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptReadResponse"

  /todos/{item_id}/action-metadata:
    patch:
      operationId: updateTodoActionMetadata
      summary: Update todo action metadata
      security:
        - ApiKeyAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - list
              properties:
                list:
                  type: string
                  enum:
                    - todo
                    - gs
                action_group:
                  type: string
                action_date:
                  type: string
                action:
                  type: string
                annual_objective:
                  type: string
                initiative_project:
                  type: string
      responses:
        "200":
          description: Todo action metadata updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoWriteResponse"

  /todos/bulk-action-metadata-simple:
    post:
      operationId: bulkUpdateTodoActionMetadata
      summary: Bulk update todo action metadata
      description: Updates many todo items. Send updates_json as a JSON string array.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - updates_json
              properties:
                updates_json:
                  type: string
                  description: JSON string array of update objects with item_id, list, and metadata fields.
      responses:
        "200":
          description: Bulk update completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateResponse"

components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string

    GptReadResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        count:
          type: integer
        result_text:
          type: string

    TodoWriteResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        item_id:
          type: string
        title:
          type: string
        list:
          type: string
        action_group:
          type: string
        action_date:
          type: string
        action:
          type: string
        annual_objective:
          type: string
        initiative_project:
          type: string

    BulkUpdateResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        updated_count:
          type: integer
        failed_count:
          type: integer

  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
