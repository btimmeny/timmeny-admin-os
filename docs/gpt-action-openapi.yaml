openapi: 3.1.0
info:
  title: Timmeny Admin OS
  version: 0.15.0
  description: >-
    API for the Timmeny Admin OS daily review workflow.


    This document is served by the deployment that implements it, at
    /gpt/action-schema.yaml, so an import from that URL is the same commit as
    the running API. /gpt/action-schema/version returns the version and a
    fingerprint of every request shape here; if it disagrees with this
    document, the import is stale and must be replaced. The version changes
    whenever a request shape does.
servers:
  - url: https://timmeny-admin-os-production.up.railway.app
security:
  - ApiKeyAuth: []
paths:
  /review/start:
    post:
      operationId: startDailyReview
      summary: Start or resume the daily review
      description: >-
        Returns the review's plan and no group: what the morning consists of
        is stated before any of it is presented. Show plan.message and
        plan.groups, then call beginReviewPlan when Brian says to begin.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  default: 50
                scope:
                  type: string
                  enum: [inbox, archived, snoozed, everything]
                  description: >-
                    Which mail to review. Omit it: the review is of the inbox,
                    and that is not a preference to confirm. Send one only when
                    Brian asks for other mail in so many words - "show me my
                    archive", "review my snoozed mail", "review everything".
                    Another scope opens its own review of the day rather than
                    adding to the one already under way.
      responses:
        "200":
          description: Review started or resumed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  review_id:
                    type: string
                    description: >-
                      The review this response is about. Every decision,
                      preparation and execution belongs to one review, so carry
                      this id from here rather than one remembered from
                      earlier in the conversation.
                  run_id:
                    type: string
                    description: The same id, under the name the routes use.
                  review_date:
                    type: string
                    format: date
                  revision:
                    type: integer
                    description: >-
                      Which review of that date this is. A second revision
                      exists only where a finished review was deliberately
                      restarted.
                  status:
                    type: string
                    enum:
                      [
                        not_started,
                        in_progress,
                        awaiting_actions,
                        completed,
                        abandoned,
                      ]
                  state:
                    type: string
                    description: The same value, under its older name.
                  started_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                  abandoned_at:
                    type: string
                    format: date-time
                  evidence_refresh_at:
                    type: string
                    format: date-time
                    description: >-
                      When Gmail was last read for this review. Answer "how
                      fresh is this?" from here, never from the clock.
                  prompt:
                    $ref: "#/components/schemas/ReviewPrompt"
                  plan:
                    $ref: "#/components/schemas/ReviewPlan"
                  summary:
                    $ref: "#/components/schemas/ReviewSummary"
                  scope:
                    $ref: "#/components/schemas/ReviewScope"
                  outstanding_execution:
                    type: array
                    description: >-
                      Groups holding decisions the mailbox has not seen. Not
                      empty means nothing has happened yet in those groups,
                      whatever the table shows: say so, and offer to prepare
                      them. A review with anything here is not finished.
                    items:
                      $ref: "#/components/schemas/OutstandingExecution"
                  current_group:
                    type: object
                    properties:
                      capability_key:
                        type: string
                        description: >-
                          The only name a group is addressed by. policy_version
                          and screen_id are versions of what it recommends and
                          how it is drawn; sending either as a key is refused.
                      state:
                        type: string
                        enum:
                          [pending, in_progress, awaiting_actions, completed]
                        description: >-
                          awaiting_actions means every row is decided and none
                          of it has been carried out.
                      outstanding_execution:
                        $ref: "#/components/schemas/OutstandingExecution"
                      screen:
                        type: object
                        properties:
                          title:
                            type: string
                          columns:
                            type: array
                            items:
                              type: object
                              properties:
                                label:
                                  type: string
                          rows:
                            type: array
                            items:
                              type: object
                              properties:
                                item_id:
                                  type: string
                                cells:
                                  type: array
                                  items:
                                    type: string
                                actions:
                                  type: array
                                  items:
                                    type: string
                          footer:
                            type: string
                          empty_text:
                            type: string
                          notice:
                            type: string
                            description: >-
                              Show it above the table, as written, whenever it
                              is present. It is where the review says that
                              decisions taken have not reached Gmail.
                  screen:
                    type: object
                    properties:
                      title:
                        type: string
                  warnings:
                    type: array
                    items:
                      type: string
                additionalProperties: true
  /review/continue:
    post:
      operationId: continueDailyReview
      summary: Resume the review already under way
      description: >-
        For "where was I?" and "carry on". It never opens a review: if there is
        none today it answers 404, and if today's is finished it answers 409
        rather than reopening it. Say what it says; do not fall back to
        startDailyReview to make an answer appear.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  default: 50
                scope:
                  type: string
                  enum: [inbox, archived, snoozed, everything]
                  description: >-
                    Which review to resume. Omit it for the inbox review.
      responses:
        "200":
          description: >-
            The review under way, with its plan. A plan already begun is
            returned active, and the review resumes from plan.current.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: There is no review of today to continue.
        "409":
          description: Today's review is finished with, and was not reopened.
  /review/restart:
    post:
      operationId: restartDailyReview
      summary: Set today's review aside and open a fresh one
      description: >-
        Only when Brian has said he wants to review the day again. It abandons
        the review that exists, refreshes Gmail, and opens the next revision of
        the same date, with a new review_id. The abandoned review keeps its
        decisions and its actions; what it loses is any preparation still open
        in it, which stops being executable at once. Never call this to clear a
        confusing state, and never call it without being asked.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  default: 50
                scope:
                  type: string
                  enum: [inbox, archived, snoozed, everything]
                  description: >-
                    Which review to restart. Omit it for the inbox review.
      responses:
        "200":
          description: A new review of the same date.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /review/runs/{run_id}/plan:
    post:
      operationId: beginReviewPlan
      summary: Agree the plan for this review, and get the first group
      description: >-
        startDailyReview returns the plan and no group: what the morning
        consists of is Brian's to agree before the first table appears. Show
        plan.message and plan.groups, then call this when he says to begin.
        Send order, only or skip only where he named groups - "do Financial
        first" is order, "only Admin" is only, "skip Legal today" is skip - and
        name capability keys, never screen titles or policy versions. All three
        are about today; none of them changes what a review normally consists
        of.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: array
                  items:
                    type: string
                  description: >-
                    Capability keys to work first, in this order. Groups not
                    named keep their configured order behind them.
                only:
                  type: array
                  items:
                    type: string
                  description: Work only these groups today; set the rest aside.
                skip:
                  type: array
                  items:
                    type: string
                  description: Set these groups aside for today.
      responses:
        "200":
          description: The plan, begun, with the first group to work.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: No such review.
        "422":
          description: >-
            A named group is not in this review, or every group was set aside.
            Say which; do not retry with a guess.
  /review/runs/{run_id}:
    get:
      operationId: readDailyReview
      summary: Read the current review state
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  review_id:
                    type: string
                    description: >-
                      The review this response is about. Every decision,
                      preparation and execution belongs to one review, so carry
                      this id from here rather than one remembered from
                      earlier in the conversation.
                  run_id:
                    type: string
                    description: The same id, under the name the routes use.
                  review_date:
                    type: string
                    format: date
                  revision:
                    type: integer
                    description: >-
                      Which review of that date this is. A second revision
                      exists only where a finished review was deliberately
                      restarted.
                  status:
                    type: string
                    enum:
                      [
                        not_started,
                        in_progress,
                        awaiting_actions,
                        completed,
                        abandoned,
                      ]
                  state:
                    type: string
                    description: The same value, under its older name.
                  started_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                  abandoned_at:
                    type: string
                    format: date-time
                  evidence_refresh_at:
                    type: string
                    format: date-time
                    description: >-
                      When Gmail was last read for this review. Answer "how
                      fresh is this?" from here, never from the clock.
                  prompt:
                    $ref: "#/components/schemas/ReviewPrompt"
                  plan:
                    $ref: "#/components/schemas/ReviewPlan"
                  summary:
                    $ref: "#/components/schemas/ReviewSummary"
                  scope:
                    $ref: "#/components/schemas/ReviewScope"
                  outstanding_execution:
                    type: array
                    description: >-
                      Groups holding decisions the mailbox has not seen. Not
                      empty means nothing has happened yet in those groups,
                      whatever the table shows: say so, and offer to prepare
                      them. A review with anything here is not finished.
                    items:
                      $ref: "#/components/schemas/OutstandingExecution"
                  current_group:
                    type: object
                    properties:
                      capability_key:
                        type: string
                        description: >-
                          The only name a group is addressed by. policy_version
                          and screen_id are versions of what it recommends and
                          how it is drawn; sending either as a key is refused.
                      state:
                        type: string
                        enum:
                          [pending, in_progress, awaiting_actions, completed]
                        description: >-
                          awaiting_actions means every row is decided and none
                          of it has been carried out.
                      outstanding_execution:
                        $ref: "#/components/schemas/OutstandingExecution"
                      screen:
                        type: object
                        properties:
                          title:
                            type: string
                          columns:
                            type: array
                            items:
                              type: object
                              properties:
                                label:
                                  type: string
                          rows:
                            type: array
                            items:
                              type: object
                              properties:
                                item_id:
                                  type: string
                                cells:
                                  type: array
                                  items:
                                    type: string
                                actions:
                                  type: array
                                  items:
                                    type: string
                          footer:
                            type: string
                          empty_text:
                            type: string
                          notice:
                            type: string
                            description: >-
                              Show it above the table, as written, whenever it
                              is present. It is where the review says that
                              decisions taken have not reached Gmail.
                additionalProperties: true
  /review/runs/{run_id}/groups/{capability_key}:
    get:
      operationId: readReviewGroup
      summary: Read one capability group
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: capability_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  capability_key:
                    type: string
                    description: >-
                      The only name this group is addressed by. policy_version
                      and screen_id name its policy and its layout, and a
                      request sending either as the key is refused with 404.
                  state:
                    type: string
                    enum: [pending, in_progress, awaiting_actions, completed]
                  outstanding_execution:
                    $ref: "#/components/schemas/OutstandingExecution"
                  scope:
                    $ref: "#/components/schemas/ReviewScope"
                  screen:
                    type: object
                    properties:
                      title:
                        type: string
                      columns:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            item_id:
                              type: string
                            cells:
                              type: array
                              items:
                                type: string
                            actions:
                              type: array
                              items:
                                type: string
                      footer:
                        type: string
                      empty_text:
                        type: string
                      notice:
                        type: string
                        description: >-
                          Show it above the table, as written, whenever it is
                          present. It is where the review says that decisions
                          taken have not reached Gmail.
                  restorable:
                    type: array
                    description: >-
                      Threads this capability moved to Trash and may take back
                      out of it. Each entry carries the exact request that
                      restores it.
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        thread_id:
                          type: string
                        subject:
                          type: string
                        action:
                          type: string
                        method:
                          type: string
                        path:
                          type: string
                        body:
                          type: object
                          additionalProperties: true
                additionalProperties: true
  /review/runs/{run_id}/items/{item_id}/decision:
    post:
      operationId: decideReviewItem
      summary: Record a decision on one item
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, override, dismiss, defer]
                action:
                  type: string
                  description: >-
                    The action to take, named as the row offers it. Gmail
                    dispositions are archive_gmail_thread,
                    move_gmail_thread_to_label, and
                    move_gmail_thread_to_trash; "delete", "remove", and
                    "trash" all mean move to Trash, which is recoverable.
                    restore_gmail_thread_from_trash undoes a Trash: it is
                    offered on the group's restorable list, and it runs
                    through preparation and confirmation like any other
                    action.
                action_params:
                  type: object
                  description: >-
                    What the action needs. move_gmail_thread_to_label needs
                    the folder to file the thread in, as
                    {"label": "Later"}, chosen from the choices the action
                    carries on the screen. Approving a recommended move with
                    no action_params files it in the folder the row showed.
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                  additionalProperties: true
                note:
                  type: string
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    type: object
                    description: >-
                      The review as it now stands. Recording a decision is not
                      taking the action it authorises: read
                      run.outstanding_execution before saying anything about
                      what has happened, and never report a decision as done.
                    properties:
                      review_id:
                        type: string
                      state:
                        type: string
                      outstanding_execution:
                        type: array
                        items:
                          $ref: "#/components/schemas/OutstandingExecution"
                      current_group:
                        type: object
                        properties:
                          capability_key:
                            type: string
                          state:
                            type: string
                          screen:
                            type: object
                            properties:
                              title:
                                type: string
                              notice:
                                type: string
                    additionalProperties: true
                  decided:
                    type: array
                    description: The rows this call decided, in their new state.
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        state:
                          type: string
                        approved_action:
                          type: string
                additionalProperties: true
  /review/runs/{run_id}/groups/{capability_key}/decisions:
    post:
      operationId: decideReviewGroup
      summary: Record one decision for several items
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: capability_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, override, dismiss, defer]
                item_ids:
                  type: array
                  items:
                    type: string
                action:
                  type: string
                  description: >-
                    The action to take on every selected row, named as the
                    rows offer it. If any selected row does not permit it the
                    whole request is refused with 409 and nothing is recorded;
                    the response names each ineligible item and why.
                action_params:
                  type: object
                  description: >-
                    What the action needs, applied to every selected row.
                    Filing several threads at once names one folder for all
                    of them, as {"label": "Later"}.
                  properties:
                    label:
                      type: string
                  additionalProperties: true
                note:
                  type: string
      responses:
        "200":
          description: Decisions recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    type: object
                    description: >-
                      The review as it now stands. Recording a decision is not
                      taking the action it authorises: read
                      run.outstanding_execution before saying anything about
                      what has happened, and never report a decision as done.
                    properties:
                      review_id:
                        type: string
                      state:
                        type: string
                      outstanding_execution:
                        type: array
                        items:
                          $ref: "#/components/schemas/OutstandingExecution"
                      current_group:
                        type: object
                        properties:
                          capability_key:
                            type: string
                          state:
                            type: string
                          screen:
                            type: object
                            properties:
                              title:
                                type: string
                              notice:
                                type: string
                    additionalProperties: true
                  decided:
                    type: array
                    description: The rows this call decided, in their new state.
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        state:
                          type: string
                        approved_action:
                          type: string
                additionalProperties: true
        "409":
          description: >-
            No decision was recorded, because at least one selected row does
            not permit it. Every offending row is named with its reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      message:
                        type: string
                      ineligible:
                        type: array
                        items:
                          type: object
                          properties:
                            item_id:
                              type: string
                            thread_id:
                              type: string
                            subject:
                              type: string
                            reason:
                              type: string
  /review/runs/{run_id}/actions/prepare:
    post:
      operationId: prepareReviewActions
      summary: Prepare the selected rows, and fix the scope
      description: >-
        Prepare only the exact selected item_ids, or the full capability only
        when entire_capability is explicitly true. Returns scope_id,
        prepared_item_ids, action_ids, exclusions, and whether scope matched.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capability_key:
                  type: string
                item_ids:
                  type: array
                  description: The exact rows the user selected.
                  items:
                    type: string
                entire_capability:
                  type: boolean
                  default: false
                  description: >-
                    Only true when the user asked for every approved row in
                    the capability. Requires capability_key, and cannot be
                    combined with item_ids.
      responses:
        "200":
          description: Actions prepared, and the scope they may execute.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope_id:
                    type: string
                  capability_key:
                    type: string
                  entire_capability:
                    type: boolean
                  requested_item_ids:
                    type: array
                    items:
                      type: string
                  prepared_item_ids:
                    type: array
                    items:
                      type: string
                  action_ids:
                    type: array
                    items:
                      type: string
                  prepared_items:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        action_id:
                          type: string
                        action:
                          type: string
                        thread_id:
                          type: string
                  excluded_items:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        reason:
                          type: string
                  scope_matches_request:
                    type: boolean
                  gmail_write_enabled:
                    type: boolean
                  counts:
                    type: object
                    properties:
                      prepared:
                        type: integer
                      failed:
                        type: integer
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action_id:
                          type: string
                        item_id:
                          type: string
                        state:
                          type: string
                        action:
                          type: string
                additionalProperties: true
        "400":
          description: >-
            The selection was not stated. Ask the user which rows they mean
            rather than resending without item_ids.
  /review/runs/{run_id}/actions/execute:
    post:
      operationId: executeReviewActions
      summary: Execute one prepared scope, and verify it
      description: >-
        Execute only the prepared scope. Requires scope_id, the exact prepared
        item_ids and action_ids, and confirm: true. Reject stale or mismatched
        scopes without writing to Gmail, then verify each result.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_id, item_ids, action_ids, confirm]
              properties:
                scope_id:
                  type: string
                  description: The scope returned by prepareReviewActions.
                item_ids:
                  type: array
                  description: >-
                    The rows being confirmed, restated: exactly the
                    prepared_item_ids the same preparation returned.
                  items:
                    type: string
                action_ids:
                  type: array
                  description: >-
                    The action ids the scope prepared, restated: exactly the
                    action_ids the same preparation returned.
                  items:
                    type: string
                confirm:
                  type: boolean
                  description: >-
                    True only when the user has confirmed this execution
                    itself, after seeing what the preparation covers.
      responses:
        "422":
          description: >-
            A required field was missing. Nothing was written. Read the
            preparation again and restate scope_id, item_ids and action_ids
            from it rather than filling any of them in from memory.
        "409":
          description: >-
            ScopeMismatch. Nothing was written. The body names the prepared
            and requested rows and how they differ; show that difference and
            prepare again rather than retrying.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      error:
                        type: string
                      message:
                        type: string
                      scope_id:
                        type: string
                      prepared_item_ids:
                        type: array
                        items:
                          type: string
                      requested_item_ids:
                        type: array
                        items:
                          type: string
                    additionalProperties: true
        "200":
          description: Actions executed and verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gmail_write_enabled:
                    type: boolean
                  counts:
                    type: object
                    properties:
                      completed:
                        type: integer
                      failed:
                        type: integer
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action_id:
                          type: string
                        item_id:
                          type: string
                        state:
                          type: string
                        action:
                          type: string
                        last_error:
                          type: string
                additionalProperties: true
  /review/runs/{run_id}/items/{item_id}/send-draft:
    post:
      operationId: approveSendDraft
      summary: Approve sending one verified draft
      description: Approves the exact draft; execution remains separate.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_id, draft_message_id, confirm]
              properties:
                draft_id:
                  type: string
                draft_message_id:
                  type: string
                confirm:
                  type: boolean
      responses:
        "200":
          description: Draft send approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_id:
                    type: string
                  item_id:
                    type: string
                  state:
                    type: string
                  action:
                    type: string
                additionalProperties: true
  /learning/rules:
    post:
      operationId: proposeCandidateRule
      summary: Propose an inactive deterministic rule
      description: Creates a proposal only; it does not activate or execute the rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capability_key, match, action, rationale]
              properties:
                capability_key:
                  type: string
                match:
                  type: object
                  properties:
                    participants:
                      type: array
                      items:
                        type: string
                    participant_domains:
                      type: array
                      items:
                        type: string
                    subject_contains:
                      type: array
                      items:
                        type: string
                    older_than_days:
                      type: integer
                    newer_than_days:
                      type: integer
                  additionalProperties: false
                action:
                  type: string
                action_params:
                  type: object
                  description: >-
                    What the action needs. A rule that files mail names its
                    folder here, as {"label": "Later"}, and the folder must
                    be one the capability files mail in.
                  properties:
                    label:
                      type: string
                  additionalProperties: true
                rationale:
                  type: string
                confidence:
                  type: number
      responses:
        "201":
          description: Rule proposed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  capability_key:
                    type: string
                  action:
                    type: string
                additionalProperties: true
  /learning/rules/{rule_id}/confirm:
    post:
      operationId: confirmCandidateRule
      summary: Confirm a rule for recommendations
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Rule confirmed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  active:
                    type: boolean
                additionalProperties: true
  /learning/rules/{rule_id}/promote:
    post:
      operationId: promoteCandidateRule
      summary: Promote a confirmed rule to automatable
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                reason:
                  type: string
      responses:
        "200":
          description: Rule promoted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  may_execute_without_approval:
                    type: boolean
                additionalProperties: true
components:
  schemas:
    OutstandingExecution:
      type: object
      description: >-
        Decisions that have been recorded and have not happened. A decision
        authorises an action; preparing, confirming and executing it is what
        changes the mailbox. Until this is gone, the threads are where they
        were: say "decided, not yet done", never "deleted" or "filed".
      properties:
        capability_key:
          type: string
        capability_name:
          type: string
        item_ids:
          type: array
          description: The exact rows waiting, and the ones to prepare.
          items:
            type: string
        approved:
          type: integer
        failed:
          type: integer
        message:
          type: string
          description: One sentence, safe to show as written.
        operation:
          type: string
          description: The operationId that carries this out - prepareReviewActions.
        method:
          type: string
        path:
          type: string
        body:
          type: object
          description: The exact request body to send, already scoped to these rows.
          additionalProperties: true
    ReviewPlan:
      type: object
      description: >-
        What this review consists of, said before any of it is presented.
        While status is proposed, current_group is absent and nothing has been
        decided: show message, the groups with their counts, and the steps,
        then call beginReviewPlan when Brian says to begin. Never present rows
        or ask for a decision while a plan is proposed.
      properties:
        status:
          type: string
          enum: [proposed, active]
        version:
          type: integer
          description: >-
            Raised whenever the order or the set-aside groups change. Quote it
            if asked which plan is being worked.
        title:
          type: string
        message:
          type: string
          description: One paragraph, safe to show as written.
        steps:
          type: array
          items:
            type: string
          description: >-
            What working each group will consist of, in order. Show them on the
            first plan of a review.
        resumed:
          type: boolean
          description: >-
            True where the review was already under way. The message then says
            where it stands and asks whether to resume from the current group.
        groups:
          type: array
          items:
            type: object
            properties:
              capability_key:
                type: string
              capability_name:
                type: string
              items:
                type: integer
              remaining:
                type: integer
                description: >-
                  Rows still on the table, which includes rows decided and
                  not yet carried out. standing says which is which.
              empty:
                type: boolean
              skipped:
                type: boolean
                description: Set aside for today, and not counted as remaining.
              standing:
                $ref: "#/components/schemas/ReviewStanding"
        working:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            type: string
        completed:
          type: array
          items:
            type: string
        remaining:
          type: array
          items:
            type: string
        current:
          type: string
        group_number:
          type: integer
        group_count:
          type: integer
        items:
          type: integer
        empty_groups:
          type: array
          items:
            type: string
        excluded:
          type: array
          items:
            type: string
          description: >-
            The mailboxes this review is not of. Answer "did you look at my
            archive?" from here.
        standing:
          $ref: "#/components/schemas/ReviewStanding"
    ReviewStanding:
      type: object
      description: >-
        What the review owes the mailbox, counted from actions rather than
        decisions. Any of these above zero means work is unfinished, whatever
        the tables show.
      properties:
        decided_not_executed:
          type: integer
          description: Decided, not prepared. Nothing has changed in Gmail.
        prepared_awaiting_confirmation:
          type: integer
          description: Prepared and waiting on Brian's confirmation.
        failed_or_unverified:
          type: integer
          description: Attempted with no verified result. Not done.
    ReviewSummary:
      type: object
      description: >-
        What the review has done, counted from verified execution only. Report
        completion from here and from nowhere else: a decision never raises
        one of these counts.
      properties:
        reviewed:
          type: integer
        done:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Completed actions by name - archived, filed, moved_to_trash,
            replies_drafted, replies_sent, tasks_created. Absent means it did
            not happen.
        deferred:
          type: integer
        dismissed:
          type: integer
        rule_matched:
          type: integer
          description: Rows whose recommendation came from a learned rule.
        standing:
          $ref: "#/components/schemas/ReviewStanding"
        message:
          type: string
          description: The end-of-review summary, safe to show as written.
    ReviewPrompt:
      type: object
      description: >-
        Admin OS asking rather than deciding. Present the choices as they are
        written and wait: a prompt is returned exactly where the next step is
        Brian's, and calling one of the choices without being told which is
        deciding for him.
      properties:
        reason:
          type: string
          enum: [review_completed, review_abandoned, plan_proposed]
        message:
          type: string
          description: One sentence, safe to show as written.
        choices:
          type: array
          items:
            type: object
            properties:
              operation:
                type: string
                description: The operationId to call if Brian chooses this.
              label:
                type: string
              method:
                type: string
              path:
                type: string
              body:
                type: object
                additionalProperties: true
    ReviewScope:
      type: object
      description: >-
        What the review looked at, stated by Admin OS. Answer questions about
        what was reviewed from this and nothing else - never infer the scope
        from which rows came back, and never propose a rule about it.
      properties:
        name:
          type: string
          enum: [inbox, archived, snoozed, everything]
        mailbox:
          type: string
          enum: [INBOX, ARCHIVE, SNOOZED, ANYWHERE]
        include_snoozed:
          type: boolean
        include_archived:
          type: boolean
        include_trash:
          type: boolean
        include_spam:
          type: boolean
        include_sent:
          type: boolean
        include_drafts:
          type: boolean
        requested:
          type: boolean
          description: True when this review was opened because a scope was asked for.
        gmail_query:
          type: string
          description: The Gmail search the review was built from.
        description:
          type: string
          description: One sentence about what was reviewed, safe to show as written.
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
