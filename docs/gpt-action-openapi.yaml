openapi: 3.1.0
info:
  title: Timmeny Admin OS
  version: 0.11.0
  description: API for the Timmeny Admin OS daily review workflow.
servers:
  - url: https://timmeny-admin-os-production.up.railway.app
security:
  - ApiKeyAuth: []
paths:
  /review/start:
    post:
      operationId: startDailyReview
      summary: Start or resume the daily review
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  default: 50
                scope:
                  type: string
                  enum: [inbox, archived, snoozed, everything]
                  description: >-
                    Which mail to review. Omit it: the review is of the inbox,
                    and that is not a preference to confirm. Send one only when
                    Brian asks for other mail in so many words - "show me my
                    archive", "review my snoozed mail", "review everything".
                    Another scope opens its own review of the day rather than
                    adding to the one already under way.
      responses:
        "200":
          description: Review started or resumed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  state:
                    type: string
                  scope:
                    $ref: "#/components/schemas/ReviewScope"
                  current_group:
                    type: object
                    properties:
                      capability_key:
                        type: string
                      screen:
                        type: object
                        properties:
                          title:
                            type: string
                          columns:
                            type: array
                            items:
                              type: object
                              properties:
                                label:
                                  type: string
                          rows:
                            type: array
                            items:
                              type: object
                              properties:
                                item_id:
                                  type: string
                                cells:
                                  type: array
                                  items:
                                    type: string
                                actions:
                                  type: array
                                  items:
                                    type: string
                          footer:
                            type: string
                          empty_text:
                            type: string
                  screen:
                    type: object
                    properties:
                      title:
                        type: string
                  warnings:
                    type: array
                    items:
                      type: string
                additionalProperties: true
  /review/runs/{run_id}:
    get:
      operationId: readDailyReview
      summary: Read the current review state
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  state:
                    type: string
                  scope:
                    $ref: "#/components/schemas/ReviewScope"
                  current_group:
                    type: object
                    properties:
                      capability_key:
                        type: string
                      screen:
                        type: object
                        properties:
                          title:
                            type: string
                          columns:
                            type: array
                            items:
                              type: object
                              properties:
                                label:
                                  type: string
                          rows:
                            type: array
                            items:
                              type: object
                              properties:
                                item_id:
                                  type: string
                                cells:
                                  type: array
                                  items:
                                    type: string
                                actions:
                                  type: array
                                  items:
                                    type: string
                          footer:
                            type: string
                          empty_text:
                            type: string
                additionalProperties: true
  /review/runs/{run_id}/groups/{capability_key}:
    get:
      operationId: readReviewGroup
      summary: Read one capability group
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: capability_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  capability_key:
                    type: string
                  state:
                    type: string
                  scope:
                    $ref: "#/components/schemas/ReviewScope"
                  screen:
                    type: object
                    properties:
                      title:
                        type: string
                      columns:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            item_id:
                              type: string
                            cells:
                              type: array
                              items:
                                type: string
                            actions:
                              type: array
                              items:
                                type: string
                      footer:
                        type: string
                      empty_text:
                        type: string
                  restorable:
                    type: array
                    description: >-
                      Threads this capability moved to Trash and may take back
                      out of it. Each entry carries the exact request that
                      restores it.
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        thread_id:
                          type: string
                        subject:
                          type: string
                        action:
                          type: string
                        method:
                          type: string
                        path:
                          type: string
                        body:
                          type: object
                          additionalProperties: true
                additionalProperties: true
  /review/runs/{run_id}/items/{item_id}/decision:
    post:
      operationId: decideReviewItem
      summary: Record a decision on one item
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, override, dismiss, defer]
                action:
                  type: string
                  description: >-
                    The action to take, named as the row offers it. Gmail
                    dispositions are archive_gmail_thread,
                    move_gmail_thread_to_label, and
                    move_gmail_thread_to_trash; "delete", "remove", and
                    "trash" all mean move to Trash, which is recoverable.
                    restore_gmail_thread_from_trash undoes a Trash: it is
                    offered on the group's restorable list, and it runs
                    through preparation and confirmation like any other
                    action.
                action_params:
                  type: object
                  description: >-
                    What the action needs. move_gmail_thread_to_label needs
                    the folder to file the thread in, as
                    {"label": "Later"}, chosen from the choices the action
                    carries on the screen. Approving a recommended move with
                    no action_params files it in the folder the row showed.
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                  additionalProperties: true
                note:
                  type: string
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  state:
                    type: string
                  current_group:
                    type: object
                    properties:
                      capability_key:
                        type: string
                      screen:
                        type: object
                        properties:
                          title:
                            type: string
                additionalProperties: true
  /review/runs/{run_id}/groups/{capability_key}/decisions:
    post:
      operationId: decideReviewGroup
      summary: Record one decision for several items
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: capability_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, override, dismiss, defer]
                item_ids:
                  type: array
                  items:
                    type: string
                action:
                  type: string
                  description: >-
                    The action to take on every selected row, named as the
                    rows offer it. If any selected row does not permit it the
                    whole request is refused with 409 and nothing is recorded;
                    the response names each ineligible item and why.
                action_params:
                  type: object
                  description: >-
                    What the action needs, applied to every selected row.
                    Filing several threads at once names one folder for all
                    of them, as {"label": "Later"}.
                  properties:
                    label:
                      type: string
                  additionalProperties: true
                note:
                  type: string
      responses:
        "200":
          description: Decisions recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  state:
                    type: string
                  current_group:
                    type: object
                    properties:
                      capability_key:
                        type: string
                      screen:
                        type: object
                        properties:
                          title:
                            type: string
                additionalProperties: true
        "409":
          description: >-
            No decision was recorded, because at least one selected row does
            not permit it. Every offending row is named with its reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      message:
                        type: string
                      ineligible:
                        type: array
                        items:
                          type: object
                          properties:
                            item_id:
                              type: string
                            thread_id:
                              type: string
                            subject:
                              type: string
                            reason:
                              type: string
  /review/runs/{run_id}/actions/prepare:
    post:
      operationId: prepareReviewActions
      summary: Prepare the selected rows, and fix the scope
      description: >-
        Resolves each approval into the exact parameters that would be sent.
        Nothing is written to Gmail here.


        Send the exact item_ids the user named. A request with no item_ids is
        refused unless entire_capability is true, which means the user asked
        for every approved row in that capability; it is never an assumption.


        The response returns a server-generated scope_id, the prepared
        item_ids, the corresponding action_ids, and every requested row that
        was left out with the reason. Compare prepared_item_ids with the rows
        the user actually named before asking for confirmation: if they differ,
        or scope_matches_request is false, show the difference and stop.
        Preparing again supersedes the previous scope_id.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capability_key:
                  type: string
                item_ids:
                  type: array
                  description: The exact rows the user selected.
                  items:
                    type: string
                entire_capability:
                  type: boolean
                  default: false
                  description: >-
                    Only true when the user asked for every approved row in
                    the capability. Requires capability_key, and cannot be
                    combined with item_ids.
      responses:
        "200":
          description: Actions prepared, and the scope they may execute.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope_id:
                    type: string
                  capability_key:
                    type: string
                  entire_capability:
                    type: boolean
                  requested_item_ids:
                    type: array
                    items:
                      type: string
                  prepared_item_ids:
                    type: array
                    items:
                      type: string
                  action_ids:
                    type: array
                    items:
                      type: string
                  prepared_items:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        action_id:
                          type: string
                        action:
                          type: string
                        thread_id:
                          type: string
                  excluded_items:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        reason:
                          type: string
                  scope_matches_request:
                    type: boolean
                  gmail_write_enabled:
                    type: boolean
                  counts:
                    type: object
                    properties:
                      prepared:
                        type: integer
                      failed:
                        type: integer
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action_id:
                          type: string
                        item_id:
                          type: string
                        state:
                          type: string
                        action:
                          type: string
                additionalProperties: true
        "400":
          description: >-
            The selection was not stated. Ask the user which rows they mean
            rather than resending without item_ids.
  /review/runs/{run_id}/actions/execute:
    post:
      operationId: executeReviewActions
      summary: Execute one prepared scope, and verify it
      description: >-
        The only operation that changes the mailbox. It requires the scope_id
        returned by prepareReviewActions, and confirm: true given for the
        execution itself rather than inherited from the decision. It runs that
        scope's action_ids and nothing else: there is no capability-wide
        execution.


        Restate the selection in item_ids and action_ids. A scope that has
        been superseded by a later preparation, already executed, or whose
        rows were decided again since, answers 409 ScopeMismatch and writes
        nothing; so does a restatement that disagrees with what was prepared.


        Every action is read back from Gmail: an archive is complete only once
        INBOX is absent, a move to Trash only once the thread is in TRASH, and
        a restore only once TRASH is gone. A thread already in the requested
        state completes without a write. A failure stays visible and
        retryable; nothing retries itself.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_id, confirm]
              properties:
                scope_id:
                  type: string
                  description: The scope returned by prepareReviewActions.
                confirm:
                  type: boolean
                item_ids:
                  type: array
                  description: The rows being confirmed, restated.
                  items:
                    type: string
                action_ids:
                  type: array
                  description: The action ids the scope prepared, restated.
                  items:
                    type: string
      responses:
        "409":
          description: >-
            ScopeMismatch. Nothing was written. The body names the prepared
            and requested rows and how they differ; show that difference and
            prepare again rather than retrying.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      error:
                        type: string
                      message:
                        type: string
                      scope_id:
                        type: string
                      prepared_item_ids:
                        type: array
                        items:
                          type: string
                      requested_item_ids:
                        type: array
                        items:
                          type: string
                    additionalProperties: true
        "200":
          description: Actions executed and verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gmail_write_enabled:
                    type: boolean
                  counts:
                    type: object
                    properties:
                      completed:
                        type: integer
                      failed:
                        type: integer
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action_id:
                          type: string
                        item_id:
                          type: string
                        state:
                          type: string
                        action:
                          type: string
                        last_error:
                          type: string
                additionalProperties: true
  /review/runs/{run_id}/items/{item_id}/send-draft:
    post:
      operationId: approveSendDraft
      summary: Approve sending one verified draft
      description: Approves the exact draft; execution remains separate.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_id, draft_message_id, confirm]
              properties:
                draft_id:
                  type: string
                draft_message_id:
                  type: string
                confirm:
                  type: boolean
      responses:
        "200":
          description: Draft send approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_id:
                    type: string
                  item_id:
                    type: string
                  state:
                    type: string
                  action:
                    type: string
                additionalProperties: true
  /learning/rules:
    post:
      operationId: proposeCandidateRule
      summary: Propose an inactive deterministic rule
      description: Creates a proposal only; it does not activate or execute the rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capability_key, match, action, rationale]
              properties:
                capability_key:
                  type: string
                match:
                  type: object
                  properties:
                    participants:
                      type: array
                      items:
                        type: string
                    participant_domains:
                      type: array
                      items:
                        type: string
                    subject_contains:
                      type: array
                      items:
                        type: string
                    older_than_days:
                      type: integer
                    newer_than_days:
                      type: integer
                  additionalProperties: false
                action:
                  type: string
                action_params:
                  type: object
                  description: >-
                    What the action needs. A rule that files mail names its
                    folder here, as {"label": "Later"}, and the folder must
                    be one the capability files mail in.
                  properties:
                    label:
                      type: string
                  additionalProperties: true
                rationale:
                  type: string
                confidence:
                  type: number
      responses:
        "201":
          description: Rule proposed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  capability_key:
                    type: string
                  action:
                    type: string
                additionalProperties: true
  /learning/rules/{rule_id}/confirm:
    post:
      operationId: confirmCandidateRule
      summary: Confirm a rule for recommendations
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Rule confirmed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  active:
                    type: boolean
                additionalProperties: true
  /learning/rules/{rule_id}/promote:
    post:
      operationId: promoteCandidateRule
      summary: Promote a confirmed rule to automatable
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                reason:
                  type: string
      responses:
        "200":
          description: Rule promoted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  may_execute_without_approval:
                    type: boolean
                additionalProperties: true
components:
  schemas:
    ReviewScope:
      type: object
      description: >-
        What the review looked at, stated by Admin OS. Answer questions about
        what was reviewed from this and nothing else - never infer the scope
        from which rows came back, and never propose a rule about it.
      properties:
        name:
          type: string
          enum: [inbox, archived, snoozed, everything]
        mailbox:
          type: string
          enum: [INBOX, ARCHIVE, SNOOZED, ANYWHERE]
        include_snoozed:
          type: boolean
        include_archived:
          type: boolean
        include_trash:
          type: boolean
        include_spam:
          type: boolean
        include_sent:
          type: boolean
        include_drafts:
          type: boolean
        requested:
          type: boolean
          description: True when this review was opened because a scope was asked for.
        gmail_query:
          type: string
          description: The Gmail search the review was built from.
        description:
          type: string
          description: One sentence about what was reviewed, safe to show as written.
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
