openapi: 3.1.0
info:
  title: timmeny-admin-os API
  version: 0.9.0
  description: >-
    GPT-safe API for Timmeny Admin OS daily email review and todo operations.
    Review responses include a versioned screen contract. Render its columns and
    row cells in the returned order without rewriting, merging, or omitting them.
servers:
  - url: https://timmeny-admin-os-production.up.railway.app
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: checkHealth
      summary: Check service health
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /todos/read-simple:
    get:
      operationId: listTodos
      summary: List todo items
      parameters:
        - name: list
          in: query
          required: false
          schema:
            type: string
            enum: [all, todo, gs]
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: include_done
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Todo items returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptReadResponse"

  /todos:
    post:
      operationId: createTodo
      summary: Create a todo item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                list:
                  type: string
                  enum: [todo, gs]
                  default: todo
                action_group:
                  type: string
                action_date:
                  type: string
                action:
                  type: string
                annual_objective:
                  type: string
                initiative_project:
                  type: string
      responses:
        "200":
          description: Todo item created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoWriteResponse"

  /todos/metadata/read-simple:
    get:
      operationId: getTodoMetadata
      summary: Get todo board metadata
      parameters:
        - name: list
          in: query
          required: false
          schema:
            type: string
            enum: [todo, gs]
            default: gs
      responses:
        "200":
          description: Board metadata returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptReadResponse"

  /key-initiatives/read-simple:
    get:
      operationId: listKeyInitiatives
      summary: List key initiatives
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: include_done
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Key initiatives returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptReadResponse"

  /todos/{item_id}/action-metadata:
    patch:
      operationId: updateTodoActionMetadata
      summary: Update todo action metadata
      parameters:
        - $ref: "#/components/parameters/TodoItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoMetadataRequest"
      responses:
        "200":
          description: Todo metadata updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoWriteResponse"

  /todos/bulk-action-metadata-simple:
    post:
      operationId: bulkUpdateTodoActionMetadata
      summary: Bulk update todo action metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [updates_json]
              properties:
                updates_json:
                  type: string
                  description: JSON string array of todo metadata updates.
      responses:
        "200":
          description: Bulk update completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateResponse"

  /review/start:
    post:
      operationId: startDailyReview
      summary: Start or resume today's email review
      description: >-
        Use for good morning, check my inbox, begin our admin, or start my review.
        Refreshes Gmail and resumes the same persisted review for the date.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                review_date:
                  type: string
                  format: date
                sync:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  minimum: 1
                  maximum: 200
                  default: 50
      responses:
        "200":
          description: Review started or resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRunResponse"

  /review/runs/{run_id}:
    get:
      operationId: readDailyReview
      summary: Read a daily review
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Review state returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRunResponse"

  /review/runs/{run_id}/groups/{capability_key}:
    get:
      operationId: readReviewGroup
      summary: Read one review group
      description: Returns the group's screen contract and item rows.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/CapabilityKey"
      responses:
        "200":
          description: Group returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewGroupResponse"

  /review/runs/{run_id}/items/{item_id}/decision:
    post:
      operationId: decideReviewItem
      summary: Record a decision on one review item
      description: >-
        Approve accepts the recommendation. Override selects another permitted
        action. Dismiss settles the item. Defer returns it in a later review.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ReviewItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemDecisionRequest"
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecisionResponse"
        "409":
          description: Decision or action is not permitted.

  /review/runs/{run_id}/groups/{capability_key}/decisions:
    post:
      operationId: decideReviewGroup
      summary: Record the same decision for several items
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/CapabilityKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupDecisionRequest"
      responses:
        "200":
          description: Decisions recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecisionResponse"
        "409":
          description: Bulk decision is not permitted.

  /review/runs/{run_id}/items/{item_id}/assessment:
    post:
      operationId: assessReviewItem
      summary: Record an AI assessment of one item
      description: >-
        Records interpretation, confidence, rationale, and an optional suggested
        action. It cannot approve or execute an external action.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ReviewItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentRequest"
      responses:
        "200":
          description: Assessment recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemResponse"
        "409":
          description: Assessment is outside capability policy.

  /review/runs/{run_id}/actions/prepare:
    post:
      operationId: prepareReviewActions
      summary: Prepare approved actions
      description: >-
        Resolves approved decisions into exact inspectable action plans. This
        operation writes nothing to Gmail and is idempotent.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareActionsRequest"
      responses:
        "200":
          description: Actions prepared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsResponse"
        "409":
          description: Action cannot be prepared.

  /review/runs/{run_id}/actions:
    get:
      operationId: listReviewActions
      summary: List actions for a review
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: capability_key
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ActionState"
      responses:
        "200":
          description: Actions returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsResponse"

  /review/runs/{run_id}/actions/{action_id}:
    get:
      operationId: readReviewAction
      summary: Read one review action
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Action returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "404":
          description: Action not found.

  /review/runs/{run_id}/actions/execute:
    post:
      operationId: executeReviewActions
      summary: Execute and verify prepared actions
      description: >-
        Executes prepared actions after checking capability permission, Gmail
        write enablement, and confirm=true. Each result is verified from Gmail.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteActionsRequest"
      responses:
        "200":
          description: Actions executed and verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsResponse"
        "400":
          description: confirm was not true.
        "409":
          description: Writes are disabled or execution is not permitted.
        "502":
          description: Gmail execution failed and was recorded for retry.
        "503":
          description: Gmail is not configured.

  /review/runs/{run_id}/actions/{action_id}/retry:
    post:
      operationId: retryReviewAction
      summary: Retry one failed action
      description: Verifies the effect first so a retry cannot duplicate a write.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Retry result returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "404":
          description: Action not found.

  /review/runs/{run_id}/actions/{action_id}/verify:
    post:
      operationId: verifyReviewAction
      summary: Verify an executed action again
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Fresh verification returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"

  /review/runs/{run_id}/items/{item_id}/send-draft:
    post:
      operationId: approveSendDraft
      summary: Approve sending one exact draft
      description: >-
        Approves one verified draft for sending. This does not send it. Execution
        is separate and is refused if the draft changed after approval.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ReviewItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveSendDraftRequest"
      responses:
        "200":
          description: Exact draft send approved but not executed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "400":
          description: confirm was not true.
        "409":
          description: Draft or capability is not eligible for sending.

  /learning/events:
    get:
      operationId: listLearningEvents
      summary: List learning events
      parameters:
        - name: capability_key
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - override
              - dismissed_recommendation
              - deferred_recommendation
              - confirmed_recommendation
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Learning events returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEventsResponse"

  /learning/rules:
    get:
      operationId: listCandidateRules
      summary: List candidate deterministic rules
      parameters:
        - name: capability_key
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RuleState"
      responses:
        "200":
          description: Candidate rules returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesResponse"
    post:
      operationId: proposeCandidateRule
      summary: Propose a deterministic rule
      description: >-
        Creates an inactive rule proposal from explicit metadata conditions. It
        cannot recommend or execute until separately confirmed or promoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeRuleRequest"
      responses:
        "201":
          description: Inactive rule proposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponse"
        "409":
          description: Capability does not permit the action or learning.
        "422":
          description: Match conditions are invalid or match every thread.

  /learning/rules/{rule_id}:
    get:
      operationId: readCandidateRule
      summary: Read one candidate rule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: Candidate rule returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponse"

  /learning/rules/{rule_id}/confirm:
    post:
      operationId: confirmCandidateRule
      summary: Confirm a rule for future recommendations
      description: A confirmed rule recommends but does not execute unattended.
      parameters:
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleTransitionRequest"
      responses:
        "200":
          description: Rule confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponse"
        "409":
          description: Rule cannot transition to confirmed.

  /learning/rules/{rule_id}/promote:
    post:
      operationId: promoteCandidateRule
      summary: Promote a confirmed rule to automatable
      description: >-
        Allows a confirmed rule to approve matching mail without asking. External
        execution still requires capability permission and enabled Gmail writes.
      parameters:
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  description: Must be true to promote the rule.
                reason:
                  type: string
      responses:
        "200":
          description: Rule promoted to automatable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponse"
        "400":
          description: confirm was not true.
        "409":
          description: Rule or capability is not eligible for automation.

  /learning/rules/{rule_id}/retire:
    post:
      operationId: retireCandidateRule
      summary: Retire a rule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleTransitionRequest"
      responses:
        "200":
          description: Rule retired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponse"

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer

  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    ReviewItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
    TodoItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
    CapabilityKey:
      name: capability_key
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: action_id
      in: path
      required: true
      schema:
        type: string
    RuleId:
      name: rule_id
      in: path
      required: true
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string

    GptReadResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        count:
          type: integer
        result_text:
          type: string

    TodoMetadataRequest:
      type: object
      additionalProperties: false
      required: [list]
      properties:
        list:
          type: string
          enum: [todo, gs]
        action_group:
          type: string
        action_date:
          type: string
        action:
          type: string
        annual_objective:
          type: string
        initiative_project:
          type: string

    TodoWriteResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        item_id:
          type: string
        title:
          type: string

    BulkUpdateResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        updated_count:
          type: integer
        failed_count:
          type: integer

    ExternalAction:
      type: string
      enum:
        - gmail.label
        - gmail.archive
        - gmail.draft_reply
        - gmail.send_draft
        - monday.create_task

    ItemDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, override, dismiss, defer]
        action:
          $ref: "#/components/schemas/ExternalAction"
        action_params:
          type: object
          additionalProperties: true
        note:
          type: string

    GroupDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, override, dismiss, defer]
        item_ids:
          type: array
          items:
            type: string
        action:
          $ref: "#/components/schemas/ExternalAction"
        note:
          type: string

    AssessmentRequest:
      type: object
      additionalProperties: false
      required: [category, confidence, rationale, model_version]
      properties:
        category:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        rationale:
          type: string
        model_version:
          type: string
        recommendation:
          $ref: "#/components/schemas/ExternalAction"

    PrepareActionsRequest:
      type: object
      additionalProperties: false
      properties:
        capability_key:
          type: string
        item_ids:
          type: array
          items:
            type: string
        action_ids:
          type: array
          items:
            type: string

    ExecuteActionsRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true to execute external writes.
        capability_key:
          type: string
        action_ids:
          type: array
          items:
            type: string

    ApproveSendDraftRequest:
      type: object
      additionalProperties: false
      required: [draft_id, draft_message_id, confirm]
      properties:
        draft_id:
          type: string
        draft_message_id:
          type: string
        confirm:
          type: boolean

    ScreenColumn:
      type: object
      additionalProperties: false
      required: [key, title]
      properties:
        key:
          type: string
        title:
          type: string

    ScreenAction:
      type: object
      additionalProperties: true
      properties:
        key:
          type: string
        label:
          type: string
        operation_id:
          type: string
        request:
          type: object
          additionalProperties: true

    ScreenRow:
      type: object
      additionalProperties: true
      required: [item_id, cells]
      properties:
        item_id:
          type: string
        cells:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string

    ReviewScreen:
      type: object
      additionalProperties: true
      required: [screen_id, layout, columns, rows]
      properties:
        screen_id:
          type: string
        title:
          type: string
        layout:
          type: string
          enum: [table]
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ScreenColumn"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ScreenRow"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ScreenAction"
        summary:
          type: object
          additionalProperties:
            type: integer

    ReviewItemResponse:
      type: object
      additionalProperties: true
      properties:
        item_id:
          type: string
        thread_id:
          type: string
        subject:
          type: string
        participants:
          type: array
          items:
            type: string
        received_at:
          type: string
          format: date-time
        state:
          type: string
        recommendation:
          type: string
        recommendation_source:
          type: string
        recommendation_confidence:
          type: number
        recommendation_rationale:
          type: string
        category:
          type: string
        approved_action:
          type: string
        requires_confirmation:
          type: boolean

    ReviewGroupResponse:
      type: object
      additionalProperties: true
      properties:
        capability_key:
          type: string
        capability_name:
          type: string
        state:
          type: string
        counts:
          type: object
          additionalProperties:
            type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewItemResponse"
        screen:
          $ref: "#/components/schemas/ReviewScreen"

    ReviewRunResponse:
      type: object
      additionalProperties: true
      properties:
        run_id:
          type: string
        review_date:
          type: string
          format: date
        state:
          type: string
        config_version:
          type: string
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
        current_group:
          $ref: "#/components/schemas/ReviewGroupResponse"
        screen:
          $ref: "#/components/schemas/ReviewScreen"
        warnings:
          type: array
          items:
            type: string

    ReviewDecisionResponse:
      type: object
      additionalProperties: true
      properties:
        run:
          $ref: "#/components/schemas/ReviewRunResponse"
        decided:
          type: array
          items:
            $ref: "#/components/schemas/ReviewItemResponse"

    ActionState:
      type: string
      enum: [approved, prepared, executed, verified, completed, failed]

    ActionResponse:
      type: object
      additionalProperties: true
      properties:
        action_id:
          type: string
        item_id:
          type: string
        capability_key:
          type: string
        action:
          type: string
        state:
          $ref: "#/components/schemas/ActionState"
        params:
          type: object
          additionalProperties: true
        prepared_params:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
        external_ref:
          type: string
        approval_kind:
          type: string
        attempts:
          type: integer
        last_error:
          type: string
        verification:
          type: object
          additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true

    ActionsResponse:
      type: object
      additionalProperties: true
      properties:
        gmail_write_enabled:
          type: boolean
        counts:
          type: object
          additionalProperties:
            type: integer
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionResponse"

    RuleMatch:
      type: object
      additionalProperties: false
      properties:
        participants:
          type: array
          items:
            type: string
        participant_domains:
          type: array
          items:
            type: string
        subject_contains:
          type: array
          items:
            type: string
        older_than_days:
          type: integer
          minimum: 0
        newer_than_days:
          type: integer
          minimum: 0

    RuleState:
      type: string
      enum: [observed, proposed, confirmed, automatable, retired]

    ProposeRuleRequest:
      type: object
      additionalProperties: false
      required: [capability_key, match, action, rationale]
      properties:
        capability_key:
          type: string
        match:
          $ref: "#/components/schemas/RuleMatch"
        action:
          $ref: "#/components/schemas/ExternalAction"
        rationale:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 1

    RuleTransitionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
        confirm:
          type: boolean

    RuleResponse:
      type: object
      additionalProperties: true
      properties:
        rule_id:
          type: string
        capability_key:
          type: string
        state:
          $ref: "#/components/schemas/RuleState"
        match:
          $ref: "#/components/schemas/RuleMatch"
        action:
          type: string
        rationale:
          type: string
        confidence:
          type: number
        observed_count:
          type: integer
        active:
          type: boolean
        may_execute_without_approval:
          type: boolean
        next_states:
          type: array
          items:
            type: string

    RulesResponse:
      type: object
      additionalProperties: true
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleResponse"

    LearningEventResponse:
      type: object
      additionalProperties: true
      properties:
        event_id:
          type: string
        capability_key:
          type: string
        kind:
          type: string
        recommended:
          type: string
        chosen:
          type: string
        recommendation_source:
          type: string
        policy_version:
          type: string
        candidate_rule_id:
          type: string
        item_id:
          type: string
        run_id:
          type: string
        at:
          type: string
          format: date-time

    LearningEventsResponse:
      type: object
      additionalProperties: true
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/LearningEventResponse"
