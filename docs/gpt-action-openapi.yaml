openapi: 3.1.0
info:
  title: Timmeny Admin OS
  version: 0.9.3
  description: API for the Timmeny Admin OS daily review workflow.
servers:
  - url: https://timmeny-admin-os-production.up.railway.app
security:
  - ApiKeyAuth: []
paths:
  /review/start:
    post:
      operationId: startDailyReview
      summary: Start or resume the daily review
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  default: 50
      responses:
        "200":
          description: Review started or resumed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  state:
                    type: string
                  current_group:
                    type: object
                    properties:
                      capability_key:
                        type: string
                      screen:
                        type: object
                        properties:
                          title:
                            type: string
                          columns:
                            type: array
                            items:
                              type: object
                              properties:
                                label:
                                  type: string
                          rows:
                            type: array
                            items:
                              type: object
                              properties:
                                item_id:
                                  type: string
                                cells:
                                  type: array
                                  items:
                                    type: string
                                actions:
                                  type: array
                                  items:
                                    type: string
                          footer:
                            type: string
                          empty_text:
                            type: string
                  screen:
                    type: object
                    properties:
                      title:
                        type: string
                  warnings:
                    type: array
                    items:
                      type: string
                additionalProperties: true
  /review/runs/{run_id}:
    get:
      operationId: readDailyReview
      summary: Read the current review state
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  state:
                    type: string
                  current_group:
                    type: object
                    properties:
                      capability_key:
                        type: string
                      screen:
                        type: object
                        properties:
                          title:
                            type: string
                          columns:
                            type: array
                            items:
                              type: object
                              properties:
                                label:
                                  type: string
                          rows:
                            type: array
                            items:
                              type: object
                              properties:
                                item_id:
                                  type: string
                                cells:
                                  type: array
                                  items:
                                    type: string
                                actions:
                                  type: array
                                  items:
                                    type: string
                          footer:
                            type: string
                          empty_text:
                            type: string
                additionalProperties: true
  /review/runs/{run_id}/groups/{capability_key}:
    get:
      operationId: readReviewGroup
      summary: Read one capability group
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: capability_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  capability_key:
                    type: string
                  state:
                    type: string
                  screen:
                    type: object
                    properties:
                      title:
                        type: string
                      columns:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            item_id:
                              type: string
                            cells:
                              type: array
                              items:
                                type: string
                            actions:
                              type: array
                              items:
                                type: string
                      footer:
                        type: string
                      empty_text:
                        type: string
                additionalProperties: true
  /review/runs/{run_id}/items/{item_id}/decision:
    post:
      operationId: decideReviewItem
      summary: Record a decision on one item
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, override, dismiss, defer]
                action:
                  type: string
                action_params:
                  type: object
                  properties:
                    value:
                      type: string
                  additionalProperties: true
                note:
                  type: string
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  state:
                    type: string
                  current_group:
                    type: object
                    properties:
                      capability_key:
                        type: string
                      screen:
                        type: object
                        properties:
                          title:
                            type: string
                additionalProperties: true
  /review/runs/{run_id}/groups/{capability_key}/decisions:
    post:
      operationId: decideReviewGroup
      summary: Record one decision for several items
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: capability_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, override, dismiss, defer]
                item_ids:
                  type: array
                  items:
                    type: string
                action:
                  type: string
                note:
                  type: string
      responses:
        "200":
          description: Decisions recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  state:
                    type: string
                  current_group:
                    type: object
                    properties:
                      capability_key:
                        type: string
                      screen:
                        type: object
                        properties:
                          title:
                            type: string
                additionalProperties: true
  /review/runs/{run_id}/actions/prepare:
    post:
      operationId: prepareReviewActions
      summary: Prepare approved actions
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                capability_key:
                  type: string
                item_ids:
                  type: array
                  items:
                    type: string
                action_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Actions prepared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gmail_write_enabled:
                    type: boolean
                  counts:
                    type: object
                    properties:
                      prepared:
                        type: integer
                      failed:
                        type: integer
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action_id:
                          type: string
                        item_id:
                          type: string
                        state:
                          type: string
                        action:
                          type: string
                additionalProperties: true
  /review/runs/{run_id}/actions/execute:
    post:
      operationId: executeReviewActions
      summary: Execute and verify prepared actions
      description: Executes only after confirm is true and server permissions allow it.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                capability_key:
                  type: string
                action_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Actions executed and verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gmail_write_enabled:
                    type: boolean
                  counts:
                    type: object
                    properties:
                      completed:
                        type: integer
                      failed:
                        type: integer
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action_id:
                          type: string
                        item_id:
                          type: string
                        state:
                          type: string
                        action:
                          type: string
                        last_error:
                          type: string
                additionalProperties: true
  /review/runs/{run_id}/items/{item_id}/send-draft:
    post:
      operationId: approveSendDraft
      summary: Approve sending one verified draft
      description: Approves the exact draft; execution remains separate.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_id, draft_message_id, confirm]
              properties:
                draft_id:
                  type: string
                draft_message_id:
                  type: string
                confirm:
                  type: boolean
      responses:
        "200":
          description: Draft send approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_id:
                    type: string
                  item_id:
                    type: string
                  state:
                    type: string
                  action:
                    type: string
                additionalProperties: true
  /learning/rules:
    post:
      operationId: proposeCandidateRule
      summary: Propose an inactive deterministic rule
      description: Creates a proposal only; it does not activate or execute the rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capability_key, match, action, rationale]
              properties:
                capability_key:
                  type: string
                match:
                  type: object
                  properties:
                    participants:
                      type: array
                      items:
                        type: string
                    participant_domains:
                      type: array
                      items:
                        type: string
                    subject_contains:
                      type: array
                      items:
                        type: string
                    older_than_days:
                      type: integer
                    newer_than_days:
                      type: integer
                  additionalProperties: false
                action:
                  type: string
                rationale:
                  type: string
                confidence:
                  type: number
      responses:
        "201":
          description: Rule proposed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  capability_key:
                    type: string
                  action:
                    type: string
                additionalProperties: true
  /learning/rules/{rule_id}/confirm:
    post:
      operationId: confirmCandidateRule
      summary: Confirm a rule for recommendations
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Rule confirmed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  active:
                    type: boolean
                additionalProperties: true
  /learning/rules/{rule_id}/promote:
    post:
      operationId: promoteCandidateRule
      summary: Promote a confirmed rule to automatable
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                reason:
                  type: string
      responses:
        "200":
          description: Rule promoted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule_id:
                    type: string
                  state:
                    type: string
                  may_execute_without_approval:
                    type: boolean
                additionalProperties: true
components:
  schemas: {}
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
