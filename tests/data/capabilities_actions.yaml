version: test.actions
channel: email

screens:
  - id: admin-test-v1
    title: Admin test review
    rows: unresolved
    columns:
      - label: "#"
        source: index
      - label: What it is
        source: what_it_is
      - label: Recommended Action
        source: recommended_action
      - label: Confidence
        source: confidence
      - label: Decision
        source: decision
    sort:
      - source: received
        direction: desc
    footer: "{remaining_items} still need you."
    actions:
      - id: approve
        label: Do what is recommended
        decision: approve
      - id: archive_gmail_thread
        label: Archive
        decision: override
        action: gmail.archive
      - id: move_gmail_thread_to_label
        label: File it in a folder
        decision: override
        action: gmail.move
      - id: move_gmail_thread_to_trash
        label: Move to Trash
        decision: override
        action: gmail.trash
      - id: dismiss
        label: Leave it alone
        decision: dismiss
      - id: defer
        label: Not today
        decision: defer
      - id: archive_gmail_thread_all
        label: Archive all of these
        decision: override
        action: gmail.archive
        scope: group
      - id: move_gmail_thread_to_label_all
        label: File all of these in one folder
        decision: override
        action: gmail.move
        scope: group
      - id: move_gmail_thread_to_trash_all
        label: Move all of these to Trash
        decision: override
        action: gmail.trash
        scope: group

  - id: test-review-v1
    title: Test review
    columns:
      - label: "#"
        source: index
      - label: What it is
        source: what_it_is
      - label: Recommended Action
        source: recommended_action
      - label: Confidence
        source: confidence
      - label: Decision
        source: decision
    actions:
      - id: approve
        label: Do what is recommended
        decision: approve
      - id: dismiss
        label: Leave it alone
        decision: dismiss
      - id: defer
        label: Not today
        decision: defer

capabilities:
  - key: admin
    name: Admin
    position: 10
    gmail:
      labels:
        - Admin
      destinations:
        - Later
        - Notes
    presentation:
      screen: admin-test-v1
    playbook:
      id: triage_and_clear
      steps:
        - collect_evidence
        - recommend
        - await_decision
        - prepare_actions
        - execute_approved
        - verify
    recommendation_policy:
      version: admin.test
      default: needs_review
      categories:
        - noise
        - errand
      rules:
        - id: newsletters_are_noise
          when:
            subject_contains:
              - Newsletter
          recommend: gmail.archive
          confidence: 0.95
          rationale: A newsletter needs reading, not doing.
    allowed_actions:
      - gmail.label
      - gmail.archive
      - gmail.move
      - gmail.trash
      - gmail.untrash
      - gmail.draft_reply
      - gmail.send_draft
      - monday.create_task
    execution:
      permitted_actions:
        - gmail.label
        - gmail.archive
        - gmail.move
        - gmail.trash
        - gmail.untrash
        - gmail.draft_reply
        - gmail.send_draft
    learning:
      scope: capability
      record_decisions: true
      record_message_content: false
      allow_rule_learning: true
      allow_automatable_rules: true

  - key: financial_taxes
    name: financial/taxes
    position: 20
    gmail:
      labels:
        - financial/taxes
    presentation:
      screen: test-review-v1
    playbook:
      id: evidence_to_obligation
      steps:
        - collect_evidence
        - recommend
        - await_decision
        - prepare_actions
        - execute_approved
        - verify
    recommendation_policy:
      version: taxes.test
      default: needs_review
      categories:
        - obligation
        - reference
    allowed_actions:
      - gmail.label
      - monday.create_task
    execution:
      permitted_actions:
        - gmail.label
    learning:
      scope: capability
      record_decisions: true
      record_message_content: false
      allow_rule_learning: true
      allow_automatable_rules: false
