version: test.auto
channel: email

screens:
  - id: test-review-v1
    title: Test review
    columns:
      - label: "#"
        source: index
      - label: What it is
        source: what_it_is
      - label: Recommended Action
        source: recommended_action
      - label: Confidence
        source: confidence
      - label: Decision
        source: decision
    footer: "{remaining_items} still need you."
    actions:
      - id: approve
        label: Do what is recommended
        decision: approve
      - id: dismiss
        label: Leave it alone
        decision: dismiss
      - id: defer
        label: Not today
        decision: defer

capabilities:
  - key: admin
    name: Admin
    position: 10
    gmail:
      labels:
        - Admin
    presentation:
      screen: test-review-v1
    playbook:
      id: triage_and_clear
      steps:
        - collect_evidence
        - recommend
        - await_decision
        - prepare_actions
        - execute_approved
        - verify
    recommendation_policy:
      version: admin.auto
      categories:
        - noise
      rules:
        - id: newsletters_are_noise
          when:
            subject_contains:
              - Newsletter
          recommend: gmail.archive
          confidence: 0.95
          rationale: A newsletter needs reading, not doing.
    allowed_actions:
      - gmail.archive
    approval:
      auto_approve:
        - gmail.archive
      min_confidence_for_auto: 0.9
