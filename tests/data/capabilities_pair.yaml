version: test.pair
channel: email

screens:
  - id: test-review-v1
    title: Test review
    columns:
      - label: "#"
        source: index
      - label: What it is
        source: what_it_is
      - label: Recommended Action
        source: recommended_action
      - label: Confidence
        source: confidence
      - label: Decision
        source: decision
    footer: "{remaining_items} still need you."
    actions:
      - id: approve
        label: Do what is recommended
        decision: approve
      - id: dismiss
        label: Leave it alone
        decision: dismiss
      - id: defer
        label: Not today
        decision: defer

capabilities:
  - key: financial_taxes
    name: financial/taxes
    position: 10
    gmail:
      labels:
        - financial/taxes
    presentation:
      screen: test-review-v1
    playbook:
      id: evidence_to_obligation
      steps:
        - collect_evidence
        - recommend
        - await_decision
        - prepare_actions
        - execute_approved
        - verify
    recommendation_policy:
      version: taxes.test
      categories:
        - obligation
        - reference
      rules:
        - id: kpmg_is_an_obligation
          when:
            subject_contains:
              - KPMG
          recommend: monday.create_task
          confidence: 0.9
          rationale: Mail from the tax adviser usually carries an obligation.
          aligns_with:
            - financial_compliance
    allowed_actions:
      - gmail.label
      - gmail.archive
      - monday.create_task
    objectives:
      default_keys:
        - financial_compliance

  - key: admin
    name: Admin
    position: 20
    gmail:
      labels:
        - Admin
    presentation:
      screen: test-review-v1
    playbook:
      id: triage_and_clear
      steps:
        - collect_evidence
        - recommend
        - await_decision
        - prepare_actions
        - execute_approved
        - verify
    recommendation_policy:
      version: admin.test
      categories:
        - noise
        - errand
      rules:
        - id: newsletters_are_noise
          when:
            subject_contains:
              - Newsletter
          recommend: gmail.archive
          confidence: 0.95
          rationale: A newsletter needs reading, not doing.
    allowed_actions:
      - gmail.label
      - gmail.archive
    approval:
      allow_bulk_decisions: false
