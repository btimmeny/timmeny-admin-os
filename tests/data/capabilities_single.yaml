version: test.single
channel: email

screens:
  - id: test-review-v1
    title: Test review
    columns:
      - label: "#"
        source: index
      - label: What it is
        source: what_it_is
      - label: Recommended Action
        source: recommended_action
      - label: Confidence
        source: confidence
      - label: Decision
        source: decision
    footer: "{remaining_items} still need you."
    actions:
      - id: approve
        label: Do what is recommended
        decision: approve
      - id: dismiss
        label: Leave it alone
        decision: dismiss
      - id: defer
        label: Not today
        decision: defer

capabilities:
  - key: financial_taxes
    name: financial/taxes
    position: 10
    gmail:
      labels:
        - financial/taxes
    presentation:
      screen: test-review-v1
    playbook:
      id: evidence_to_obligation
      steps:
        - collect_evidence
        - recommend
        - await_decision
        - prepare_actions
        - execute_approved
        - verify
    recommendation_policy:
      version: taxes.test
      categories:
        - obligation
        - reference
    allowed_actions:
      - gmail.label
      - gmail.archive
      - monday.create_task
